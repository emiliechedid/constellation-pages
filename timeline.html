    <style>

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap');

.tl-root {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem 0;
  box-sizing: border-box;
  background: transparent;
  color: #212121;
}
.tl-root *, .tl-root *::before, .tl-root *::after {
  box-sizing: border-box;
}

/* Page Header */
.tl-page-header {
  text-align: center;
  margin-bottom: 1.5rem;
  padding: 1rem 0;
}
.tl-main-title {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 2.5rem;
  font-weight: 300;
  color: #212121;
  margin: 0 0 0.5rem 0;
  text-transform: uppercase;
  letter-spacing: 3px;
}
.tl-intro {
  font-size: 1rem;
  color: #757575;
  margin: 0;
  font-weight: 300;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

/* Fixed Header (contains Constellation + Toolbar) */
.tl-fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: #F7EFD8;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
/* Spacer to prevent content from being hidden behind fixed header */
.tl-fixed-header + * {
  margin-top: 130px;
}

/* Toolbar */
.tl-toolbar {
  background: #F7EFD8;
  border-bottom: 1px solid #e0e0e0;
  padding: 0.75rem 1rem;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: nowrap;
}

/* Toolbar title */
.tl-toolbar-title {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 1.1rem;
  font-weight: 400;
  color: #212121;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 2px;
  flex-shrink: 0;
}

/* Unified toolbar button style */
.tl-toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 0.8rem;
  border: 1px solid #e0e0e0;
  background: #F7EFD8;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  color: #666;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-decoration: none;
  flex-shrink: 0;
}
.tl-toolbar-btn:hover {
  background: #efe4c0;
  border-color: #212121;
  color: #212121;
}
.tl-toolbar-btn.tl-active {
  background: #212121;
  color: #fff;
  border-color: #212121;
}

/* Constellation title in toolbar center - REMOVED, no longer used */

/* Introduction section below toolbar */
.tl-intro-section {
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem 1.5rem;
  background: #F7EFD8;
  border-bottom: 1px solid #e0e0e0;
}
.tl-intro-text {
  font-size: 0.95rem;
  color: #616161;
  line-height: 1.7;
  margin: 0;
  text-align: center;
  font-weight: 300;
}

/* Search Box */
.tl-search-box {
  position: relative;
  display: flex;
  align-items: center;
}
.tl-search-input {
  padding: 0.5rem 2rem 0.5rem 0.75rem;
  border: 1px solid #e0e0e0;
  font-size: 0.85rem;
  font-family: Arial, sans-serif;
  width: 200px;
  transition: all 0.2s ease;
}
.tl-search-input:focus {
  outline: none;
  border-color: #212121;
  width: 250px;
}
.tl-search-icon {
  position: absolute;
  right: 0.5rem;
  pointer-events: none;
  color: #757575;
}

/* Filter Dropdowns */
.tl-filter-dropdown {
  position: relative;
  flex-shrink: 0;
}
.tl-toolbar-btn.tl-open {
  background: #212121;
  color: #fff;
  border-color: #212121;
}
.tl-filter-dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  background: #F7EFD8;
  border: 1px solid #e0e0e0;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  min-width: 200px;
  max-height: 400px;
  overflow-y: auto;
  z-index: 101;
  margin-top: 0.25rem;
}
.tl-filter-dropdown-menu.tl-open {
  display: block;
}
.tl-filter-dropdown-header {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem;
  border-bottom: 1px solid #e0e0e0;
  background: #F7EFD8;
}
.tl-filter-action-btn {
  flex: 1;
  padding: 0.4rem;
  border: 1px solid #e0e0e0;
  background: #F7EFD8;
  cursor: pointer;
  font-size: 0.7rem;
  font-family: 'Oswald', Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s ease;
}
.tl-filter-action-btn:hover {
  background: #212121;
  color: #fff;
  border-color: #212121;
}
.tl-filter-options {
  padding: 0.5rem;
}
.tl-filter-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s ease;
}
.tl-filter-option:hover {
  background: #efe4c0;
}
.tl-filter-option input[type="checkbox"] {
  cursor: pointer;
}

/* Filter Count */
.tl-filter-count {
  font-size: 0.75rem;
  color: #757575;
  font-family: 'Oswald', Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tl-visible-count {
  font-weight: 600;
  color: #212121;
}

/* Filter toggle button */
.tl-filter-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  color: #666;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tl-filter-toggle:hover {
  color: #212121;
}
.tl-filter-toggle svg {
  transition: transform 0.3s ease;
}
.tl-filters:not(.tl-collapsed) .tl-filter-toggle svg {
  transform: rotate(180deg);
}
.tl-filters:not(.tl-collapsed) .tl-filter-toggle {
  color: #212121;
}

/* Filter content (collapsible) */
.tl-filter-content {
  max-height: 500px;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  opacity: 1;
  padding-top: 1rem;
}
.tl-filters.tl-collapsed .tl-filter-content {
  max-height: 0;
  opacity: 0;
  padding-top: 0;
}

/* Filter styles */
.tl-filters {
  background: #fff;
  border: 1px solid #e0e0e0;
  padding: 0.75rem 1rem;
  margin-bottom: 1.5rem;
}
.tl-filter-group {
  margin-bottom: 1rem;
}
.tl-filter-group:last-of-type {
  margin-bottom: 0.5rem;
}
.tl-filter-label {
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  font-size: 0.75rem;
  color: #666;
  margin-bottom: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tl-filter-options {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.tl-filter-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.9rem;
  background: #f5f5f5;
  border: 1px solid #e0e0e0;
  cursor: pointer;
  font-size: 0.8rem;
  color: #666;
  transition: all 0.2s ease;
  user-select: none;
}
.tl-filter-checkbox:hover {
  border-color: #212121;
}
.tl-filter-checkbox input {
  display: none;
}
.tl-filter-checkbox input:checked + span {
  color: #fff;
}
.tl-filter-checkbox.tl-checked {
  background: #212121;
  color: #fff;
  border-color: #212121;
}
.tl-filter-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid #e0e0e0;
}
.tl-filter-btn {
  padding: 0.4rem 0.8rem;
  border: 1px solid #e0e0e0;
  background: transparent;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  color: #666;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tl-filter-btn:hover {
  background: #f5f5f5;
  border-color: #212121;
}
.tl-filter-count {
  margin-top: 0.8rem;
  font-size: 0.8rem;
  color: #9e9e9e;
  text-align: center;
}
.tl-visible-count {
  font-weight: 500;
  color: #212121;
}

/* Hidden elements */
.tl-year.tl-hidden,
.tl-event.tl-hidden,
.tl-slide.tl-hidden {
  display: none !important;
}
.tl-year.tl-no-visible-events {
  display: none !important;
}

/* No results message */
.tl-no-results {
  text-align: center;
  padding: 3rem 1rem;
  color: #9e9e9e;
  font-size: 1rem;
}

/* Linear view wrapper with side navigation */
.tl-linear-wrapper {
  display: flex;
  gap: 1.5rem;
  position: relative;
  background: #F7EFD8;
}

/* Year navigation - separate section below toolbar */
.tl-year-nav {
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  background: #F7EFD8;
  border-bottom: 1px solid #e0e0e0;
}
.tl-year-nav-track {
  width: 2px;
  background: #e0e0e0;
  position: relative;
  align-self: stretch;
  min-height: 30px;
}
.tl-year-nav-progress {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background: #212121;
  height: 0%;
  transition: height 0.3s ease;
}
.tl-year-nav-buttons {
  display: flex;
  flex-direction: row;
  gap: 0.25rem;
  flex-wrap: wrap;
  flex: 1;
}
.tl-year-nav-btn {
  padding: 0.35rem 0.6rem;
  border: 1px solid #e0e0e0;
  background: #F7EFD8;
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 400;
  font-family: 'Oswald', Arial, sans-serif;
  color: #9e9e9e;
  transition: all 0.2s ease;
  white-space: nowrap;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.tl-year-nav-btn:hover {
  color: #212121;
  border-color: #212121;
  background: #efe4c0;
}
.tl-year-nav-btn.tl-active {
  color: #fff;
  background: #212121;
  border-color: #212121;
  font-weight: 500;
}

/* Linear view content */
.tl-linear-view {
  flex: 1;
  min-width: 0;
  padding-left: 2rem;
  border-left: 1px solid #e0e0e0;
  position: relative;
  background: #F7EFD8;
}

/* Timeline style - Emilie Chedid */
.tl-year {
  margin-top: 2.5rem;
  padding-top: 0;
  position: relative;
}
.tl-year:first-child {
  margin-top: 0;
}
.tl-year-title {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 1.75rem;
  font-weight: 300;
  color: #212121;
  margin-bottom: 1.5rem;
  margin-left: -2.5rem;
  padding-left: 1rem;
  position: relative;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.tl-year-title::before {
  content: '';
  position: absolute;
  left: -0.5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  background: #212121;
  border-radius: 50%;
  border: 2px solid #fff;
}

/* Event styling */
.tl-event {
  position: relative;
  margin-bottom: 1.5rem;
  padding-left: 0;
}
.tl-event-dot {
  display: none;
}
.tl-event-content {
  display: flex;
  flex-direction: column;
  background: #fff;
  padding: 1.25rem;
  border: 1px solid #e0e0e0;
  transition: all 0.2s ease;
}
.tl-event-content:hover {
  border-color: #212121;
}
.tl-event-title {
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 1.25rem;
  font-weight: 500;
  margin: 0 0 0.25rem 0;
  color: #212121;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tl-event-subtitle {
  display: block;
  font-size: 0.875rem;
  font-weight: 400;
  color: #757575;
  margin-bottom: 0.5rem;
  font-style: italic;
}
.tl-event-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 0.75rem;
}
.tl-event-categories {
  margin: 0;
  font-size: 0.8rem;
  flex: 1;
}
.tl-event-tag {
  display: inline-block;
  background: #f5f5f5;
  color: #424242;
  border: 1px solid #e0e0e0;
  padding: 0.2rem 0.7rem;
  margin-right: 0.3rem;
  margin-bottom: 0.3rem;
  font-size: 0.75rem;
  font-weight: 400;
}
.tl-event-metadata {
  margin-bottom: 0.75rem;
  font-size: 0.8rem;
  color: #757575;
}
.tl-event-meta {
  display: inline-block;
  margin-right: 1rem;
  margin-bottom: 0.25rem;
}
.tl-event-meta strong {
  color: #424242;
  font-weight: 500;
}
.tl-event-description {
  color: #424242;
  line-height: 1.7;
  font-size: 0.9rem;
}
.tl-event-description p {
  margin: 0.5rem 0;
}
.tl-event-media {
  margin: 0.75rem 0;
}
.tl-event-media img {
  max-width: 100%;
  height: auto;
  display: block;
}
.tl-event-link {
  margin-top: 0.75rem;
  font-size: 0.85rem;
}
.tl-event-link a {
  color: #212121;
  text-decoration: none;
  font-weight: 400;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  border-bottom: 1px solid #212121;
  padding-bottom: 2px;
  transition: opacity 0.2s ease;
}
.tl-event-link a:hover {
  opacity: 0.6;
}
.tl-event-link a::after {
  content: '→';
  transition: transform 0.2s ease;
}
.tl-event-link a:hover::after {
  transform: translateX(4px);
}

/* Fiche technique */
.tl-fiche-technique {
  margin-top: 1rem;
  background: #fafafa;
  border: 1px solid #e0e0e0;
  overflow: hidden;
}
.tl-fiche-technique summary {
  padding: 0.75rem 1rem;
  cursor: pointer;
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  font-size: 0.8rem;
  color: #424242;
  background: #f5f5f5;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: background 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tl-fiche-technique summary:hover {
  background: #e0e0e0;
}
.tl-fiche-technique summary:focus,
.tl-fiche-technique summary:active {
  outline: none;
  text-transform: uppercase;
}
.tl-fiche-technique summary::-webkit-details-marker {
  display: none;
}
.tl-fiche-technique summary::before {
  content: '+';
  font-size: 0.875rem;
  font-weight: 300;
  transition: transform 0.2s ease;
}
.tl-fiche-technique[open] summary::before {
  content: '−';
}
.tl-fiche-technique .tl-fiche-content {
  padding: 1rem;
  font-size: 0.8rem;
  color: #424242;
  line-height: 1.7;
  max-height: none;
  overflow: visible;
}
.tl-fiche-technique .tl-fiche-content p {
  margin: 0.3rem 0;
}
.tl-fiche-technique .tl-fiche-content strong {
  color: #212121;
  font-weight: 500;
}

/* YouTube embed */
.tl-youtube {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  margin-top: 0.75rem;
}
.tl-youtube iframe {
  position: absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
}
.tl-youtube-hidden {
  display: none;
}

/* YouTube placeholder/poster for lazy loading */
.tl-youtube-placeholder {
  cursor: pointer;
}
.tl-youtube-poster {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tl-youtube-poster img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tl-youtube-play {
  position: relative;
  z-index: 1;
  width: 68px;
  height: 48px;
  opacity: 0.9;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.tl-youtube-placeholder:hover .tl-youtube-play {
  opacity: 1;
  transform: scale(1.1);
}
.tl-youtube-play svg {
  width: 100%;
  height: 100%;
}

/* Share button */
.tl-share-container {
  position: relative;
  display: inline-block;
  margin-top: 0.75rem;
}
.tl-share-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.8rem;
  border: 1px solid #e0e0e0;
  background: #fff;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: 'Oswald', Arial, sans-serif;
  font-weight: 400;
  color: #666;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tl-share-btn svg {
  width: 14px;
  height: 14px;
}
.tl-share-btn:hover {
  background: #f5f5f5;
  border-color: #212121;
  color: #212121;
}
.tl-share-dropdown {
  position: absolute;
  bottom: 100%;
  left: 0;
  background: #fff;
  border: 1px solid #e0e0e0;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
  z-index: 100;
  min-width: 160px;
  display: none;
  margin-bottom: 4px;
}
.tl-share-dropdown.tl-open {
  display: block;
}
.tl-share-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: Arial, sans-serif;
  color: #424242;
  text-align: left;
  transition: background 0.2s ease;
}
.tl-share-option:hover {
  background: #f5f5f5;
}
.tl-share-option svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.tl-share-copied {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #212121;
  color: #fff;
  padding: 0.4rem 0.8rem;
  font-size: 0.75rem;
  white-space: nowrap;
  margin-bottom: 8px;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.tl-share-copied.tl-visible {
  opacity: 1;
}

/* Image gallery */
.tl-gallery {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
}
.tl-gallery-img {
  display: none;
  width: 100%;
  height: auto;
  border-radius: 4px;
}
.tl-gallery-img.tl-gallery-active {
  display: block;
}
.tl-gallery-prev,
.tl-gallery-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.9);
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #424242;
  transition: all 0.2s ease;

ureux pour toi", "subtitle": "Vidéomusique", "categories": ["image", "montage_image", "film"], "categoriesDisplay": ["Image", "Monteuse", "Réalisatrice"], "categoriesAttr": "image montage_image film", "image": "", "images": [], "youtubeId": "aSrdS4ycQ_U", "link": "", "artiste": "Joseph Chedid", "production": "Maison Rock", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Rien n’était prévu. On prend un café le matin ensemble. On monte dans le studio, j’attrape la caméra de Joseph et hop, on tourne. Ça donne un clip vif, joyeux, tourné et postproduit en 48h à Maison Rock studio.</p>", "ficheHtml": "<p>Réalisation, image &amp; post-production Emilie CHEDID / Make-up Violette CHEDID / Titre JE SUIS HEUREUX POUR TOI (Joseph CHEDID) / Guitare &amp; basse additionnelles Antonin FRESSON / Chœurs Charlène JUAREZ / Marie LEVRON / Hamza DJENAT / Album HEY FRIEND! / Écrit, composé, interprété, enregistré, réalisé, mixé &amp; produit Joseph CHEDID (Studio &amp; label indépendant Maison Rock, dirigé par Joseph CHEDID) / Mastering Antoine CHABERT (Chab) / Tour management Far Prod / Management Aurélie MARZYNSKI / Promo Romane MONNIER / © TDR 2024 – Maison Rock / Emilie CHEDID</p>", "artistIds": [143, 5, 6]}, {"id": 4, "year": "2023", "title": "Mogodo", "subtitle": "Vidéomusique", "categories": ["D.A", "film"], "categoriesDisplay": ["D.A", "Réalisatrice"], "categoriesAttr": "D.A film", "image": "", "images": [], "youtubeId": "59iSIexQTP8", "link": "", "artiste": "-M-", "production": "Labo -M- / Wagram Music", "realisation": "Emilie Chedid", "featuring": "-M- & The Mogodo’s", "descriptionHtml": "<p>ça faisait des années que je n’avais pas réalisé un clip pour Matthieu. Je me souviens que durant son enregistrement d’album, j’avais tilté sur ce morceau. C’est bien plus tard que Matthieu m’a sollicité pour écrire ce projet. Un revival seventies. Matthieu grimé en Louis. Un bébé -M-. Des T.shirt et photos qui parlent. Des amis et la famille qui viennent danser. Un n": "Emil éditions", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>« Ghost Clusters » Roman graphique illustré et écrit par Emilie Chedid. C'est l'histoire d'un gros connard de virus qui bouleverse notre monde dans sa globalité. Qui nous envahit de peur, de contrariétés. Comme un journal intime illustré, Ghost Clusters relate le quotidien d'Emilie avec humour et poésie. Ses deux filles, sa famille d'artistes, son amoureux l'accompagnent tout le long de cette histoire. La vision qu'elle partage de cette année 2020 sous Covid, nous livre un éclairage touchant sur notre état de résilience face aux changements et aux circonstances imprévues.</p>", "ficheHtml": "<p>Ecrit, illustré, mis en pages et édité par Emilie Chedid.\nRelecture : Olivia Karam\nAide mise en page : Fabien Alencar\nAttachée de presse : Charlotte Dumas-Vorzet.\nImprimé chez Books Factory en décembre 2020.</p>", "artistIds": [178, 6]}, {"id": 12, "year": "2020", "title": "Naïvetés by Emil", "subtitle": "Exposition", "categories": ["illustration"], "categoriesDisplay": ["Illustratrice"], "categoriesAttr": "illustration", "image": "", "images": ["https://static.wixstatic.com/media/3d23ce_c089c46388e5406dac3f08207c84ebcb~mv2.jpg", "https://static.wixstatic.com/media/3d23ce_c7a1215425fe42fe8220a23f8d75559f~mv2.jpg"], "youtubeId": null, "link": "https://www.emiliechedid.fr/shop", "artiste": "Emil (Illustrations)", "production": "Café Noir", "realisation": "", "featuring": "", "descriptionHtml": "<p>Exposition tout l’été au café noir de Noirmoutier en l’île (85).</p>", "ficheHtml": "<p>Vous pouvez retrouver les illustrations sur la boutique en ligne https://www.emiliechedid.fr/shop</p>", "artistIds": [6, 26]}, {"id": 13, "year": "2020", "title": "Vibrations", "subtitle": "Théâtre", "categories": ["ecriture", "mise_en_scène"], "categoriesDisplay": ["Autrice", "Mise en scène"], "categoriesAttr": "ecriture mise_en_scène", "image": "", "images": ["https://static.wixstatic.com/media/3d23ce  / © 2018 Parlophone / Warner Music France</p>", "artistIds": [36, 161, 162, 163, 164, 37, 38, 6]}, {"id": 21, "year": "2018", "title": "Slap !", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "FwrMKGaUlbU", "link": "", "artiste": "Slap!", "production": "Cowgirl Music", "realisation": "Emilie Chedid", "featuring": "Sandra Derlon, Micky Green, Charlène Juarez", "descriptionHtml": "<p>Slap!, c’est de la pop, du ska, de la northern soul, du R’n’B, du hip hop, du reggae… Un mélange assumé à l’image du groupe, impossible à faire rentrer dans une case. Derrière les pseudos, trois amies musiciennes : Charlène Juarez, alias Chat, aux claviers, Michaela “Micky” Green à la batterie, et Sandra Derlon à la guitare. Ensemble, elles forment un trio libre, sans règles ni prise de tête, qui joue avec les styles musicaux et l’auto-dérision.</p>", "ficheHtml": "<p>Réalisation &amp; D.A Emilie CHEDID / Chef opérateur Aurélien DUBOIS / Figuration Tony DERLON / Ornella TOWANOU / Joseph CHEDID / Déco Sylvia FRANÇOIS / Caroline WATELET / Assistants Théo FOUILLEUL / Stylisme Stéphanie VAILLANT / Maquillage &amp; coiffure valiyi (Hmcparis) / Gloria / Anne-Laure / Catering Andréa JUAREZ / Montage Emilie CHEDID / Aurélien GUÉGAN / Remerciements Guillaume ANANDA / Luc ANGER / Tourné à Pontmoulin (chez Anne-Laure CLÉMENCE / Vincent DEVILLIERS) / © 2018 Cowgirl Music</p>", "artistIds": [39, 42, 41, 40, 43, 6]}, {"id": 22, "year": "2018", "title": "Une histoire d’âme", "subtitle": "Documentaire", "categories": ["film"], "categoriesDisplay": ["Réalisatrice"], "categoriesAttr": "film", "image": "", "images": [], "youtubeId": "OV1go4W8gZw", "link": "", "artiste": "Lamomali", "production": "Labo -M- / Wagram Music", "realisation": "Emilie Chedid, Timothée Hilst", "featuring": "Toumani Diabaté, Fatoumata Diawara, -M-, Brad Ackley, Lawrence Clais, Louis T M’LEUX / Montage Aurélien GUÉGAN / Étalonnage Ghislain RIO / Mixage Romain COLONNA d’ISTRIA / Production exécutive Chiips / Bénédicte CARTIGNY / Moyens techniques Chiips / Lylo / Album enregistré aux studios La Fabrique (St Rémy de Provence) par Charles DE SCHUTTER (assisté de Naël BARAKAT) / Mixé &amp; masterisé au studio Rec’N Roll (Bruxelles) par Charles DE SCHUTTER (assisté de Naël BARAKAT) / Production exécutive album Antoine DATHANAT (assisté de Marie-José SARAZIN) / Chef de projet Jérôme MARROC-LATOUR (assisté de Céline FIACK) / Management &amp; production exécutive Olivier WURTH / Pour Louis CHEDID Hélène TEXIER / Pour Labo M Gaspard BORGEAUD / Pour Joseph “Selim” CHEDID Élodie FILLEUL / Pour Anna “Nach” CHEDID Alain LAHANA / Guitares &amp; backline Sylvain COPPIN / Pierrick LAPUYADE / Régie Feal LE ROUZIC / La Fabrique – studio Isabelle / Hervé LE GILL / Assistant studio Daniel CAYOTTE / Stagiaires Rémy DUMELZ / Arthur MEYER / Chef cuisine Marie / © 2015 Riviera – Maison Barclay (Universal Music France)</p>", "artistIds": [15, 143, 73, 76, 54, 55, 6]}, {"id": 30, "year": "2016", "title": "Les copains d’abord", "subtitle": "Vidéomusique", "categories": ["image", "film"], "categoriesDisplay": ["Image", "Réalisatrice"], "categoriesAttr": "image film", "image": "", "images": [], "youtubeId": "Fk6IDDxH5Ac", "link": "", "artiste": "André Dussollier, Audrey Tautou, Catherine Frot, François Berléand, François Morel, Guillaume Gallienne, Jean-Pierre Darroussin, Julie Depardieu, Karin Viard, Lionel Abelanski, Léa Drucker, Michel Bouquet, Michel Fau, Pierre Richard, Roger Dumas, Valérie Bonneton", "production": "Kiosco / Mercury Music Group / Virgin", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Brassens sur Parole(s) est un hommage choral à Georges Brassens, imaginé pour le 35ᵉ anniversaire de sa disparition. Sous la direction artistique de Louis Chedid, et à l’initiative conjointe de ce dernier et d’Ève Cazzani, petite-nièce du poète sétois, seize comédiens et comédiennes se réapproprient les chansons de Brassens en les disant ou en les chantant. Plutôt que de faire appel aux chanteurs habituellement associés à son univers, le projet confie ces textes à des voix de cinéma et de théâtre : François Morel, Audrey Tautou, Jean-Pierre Darroussin, André Dussollier, Michel Bouquet, François Berléand, Karin Viard, Julie Depardieu, Guillaume Gallienne, entre autres. Chacun et chacune prête sa personnalité à un titre, révélant la force, l’humour, la tendresse et parfois la gravité de cette langue ciselée.Les arrangements, loin du simple pastiche « voix-guitare-contrebasse », explorent d’autres couleurs (jazz, latino, etc.) et démontrent à quel point l’œuvre de Brassens supporte la métamorphose sans perdre son âme. Le projet se clôt sur « Les Copains d’abord », interprété collectivement, comme un clin d’œil affectueux et un « petit bonheur posthume » offert à l’un des plus grands auteurs-compositeurs de la chanson française.</p>", "ficheHtml": "<p>Réalisation &amp; cadre Emilie CHEDID / Production Kiosco / Clément CHOVIN / Montage Pablo TEYSSIER-VERGER / Arrangements Louis CHEDID / Cyril TAÏEB / Direction artistique &amp; réalisation Louis CHEDID / Graphisme Clémentine LARROUMET / Management Hélène TEXIER / Assistante production Jodie MEYLON / Tourné au studio Question de Son</p>", "artistIds": [56, 57, 58, 59, 60, 61, 62, 63, 64, 66, 65, 67, 68, 69, 70, 71, 152, 49, 48, 6]}, {"id": 31, "year": "2016", "title": "Brassens sur parole(s)", "subtitle": "Bande annonce", "categories": ["image", "film"], "categoriesDisplay": ["Image", "Réalisatrice"], "categoriesAttr": "image film", "image": "", "images": [], "youtubeId": "DeI5deT-zqM", "link": "", "artiste": "Louis Chedid", "production": "Kiosco / Mercury Music Group / Virgin", "realisation": "Emilie Chedid", "featuring": "Audrey Tautou, Catherine Frot, Léa Drucker, Valérie Bonneton, Karin Viard, André Dussollier, François Berléand, François Morel, Guillaume Gallienne, Julie Depardieu, Michel Bouquet, Pierre Richard, Michel Fau, Roger Dumas, Lionel Abelanski, Jean-Pierre Darroussin", "descriptionHtml": "<p>Bande annonce du documentaire. Brassens sur parole(s) est un album choral qui réunit seize grandes figures du cinéma français autour de l’œuvre de Georges Brassens. Sous la direction artistique et la réalisation musicale de Louis Chedid, avec les arrangements de Louis Chedid et Cyril Taïeb, ces comédiens ne jouent pas seulement les chansons : ils les incarnent, en font entendre l’humour, la tendresse et la mélancolie.</p>", "ficheHtml": "<p>Réalisation &amp; cadre Emilie CHEDID / Production Kiosco / Clément CHOVIN / Montage Pablo TEYSSIER-VERGER / Arrangements Louis CHEDID / Cyril TAÏEB / Direction artistique &amp; réalisation Louis CHEDID / Graphisme Clémentine LARROUMET / Management Hélène TEXIER / Assistante production Jodie MEYLION / Tourné au studio Question de Son / Avec Jean-Pierre DARROUSSIN (J’ai rendez-vous avec vous) / Karine VIARD (Mourir pour des idées) / Michel FAU (Le pornographe) / Guillaume GALLIENNE (La prière) / Audrey TAUTOU (La mauvaise réputation) / Pierre RICHARD (Les passantes) / Michel BOUQUET (Il n’y a pas d’amour heureux) / Catherine FROT (La plainte des filles de joie) / Lionel ABELANSKI (Je me suis fait tout petit) / Roger DUMAS (Auprès de mon arbre) / Julie DEPARDIEU (Le gorille) / Léa DRUCKER (Les amoureux des bancs publics) / François MOREL (La non-demande en mariage) / François BERLÉAND (Le temps ne fait rien à l’affaire) / Valérie BONNETON (Chanson pour l’Auvergnat) / André DUSSOLLIER (Supplique pour être enterré à la plage de Sète) / Final Jean-Pierre DARROUSSIN / Karine VIARD / Michel FAU / Guillaume GALLIENNE / Audrey TAUTOU / Pierre RICHARD / Michel BOUQUET / Catherine FROT / Lionel ABELANSKI / Roger DUMAS / Julie DEPARDIEU / Léa DRUCKER / François MOREL / François BERLÉAND / Valérie BONNETON / André DUSSOLLIER (Les copains d’abord)</p>", "artistIds": [73, 57, 58, 65, 71, 64, 56, 59, 60 e par Matthias Picard avec Emilie Chedid, sampler par Pierre Boscheron et avec Charly de Schutter au Moog.</p>", "ficheHtml": "<p>Réalisation &amp; montage Emilie CHEDID / Texte 13 ans après Labo -M-, Matthieu CHEDID propose un deuxième interlude musical entre deux albums de -M- : la B.O² -M-, objet à tiroirs mêlant musique, conte, dessin et orange numérique / Lien http://www.editions2024.com/labo2m\nRemerciements Labo -M- / Smïle Arts &amp; Communication / Crazybaby! / Partenaires B.O² -M- Expérience Le Yoyo / Le Palais de Tokyo / Auguri / Devialet / Ed.2024 / Procédés Chénel / Villa Schweppes / Henryot &amp; Cie / Fontana Arte / My Design / Posca / Uni-ball / Pierre Hermé / Each Other / HP / Wacom</p>", "artistIds": [153, 75, 13, 6]}, {"id": 34, "year": "2015", "title": "Âme mélodique", "subtitle": "Vidéomusique", "categories": ["D.A", "film"], "categoriesDisplay": ["D.A", "Réalisatrice"], "categoriesAttr": "D.A film", "image": "", "images": [], "youtubeId": "F_r7y3Mefmc", "link": "", "artiste": "Nach", "production": "Chiips / Polydor-Universal Music France", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Titre extrait du premier album de Anna Chedid, alias Nach (2015). L’âme mélodique de NACH, c’est son côté multi-instrumentiste. Son album, elle l’a composé et écrit seule, elle y joue de presque tous les instruments. C’est pourquoi, j’aimerais mettre en valeur cette facette d’elle dans ce clip. Anna commence et finit au piano. Elle est seule, perdue dans l’espace noir. Au montage, on joue ensuite sur Anna qui joue de tous les autres instruments (basse, batterie, autre claviers) et forme un groupe à elle toute seule. Puis ses musiciennes la remplacent par intermittence à la basse, batterie et autre clavier.</p>", "ficheHtml": "<p>Avec Anna CHEDID / Lucie ANTUNES / Clémence LASME / Laurie XHAARD / Réalisation Emilie CHEDID / Chef opérateur Yvan SCHRECK / Lumières Javier RUIZ GOMEZ / Assistant caméra Nicolas DJIAN / Chef maquillage &amp; coi  PAJOT / Chef d’équipement Philippe VIROLLAUD</p>", "artistIds": [15, 143, 73, 76, 82, 81, 6, 145]}, {"id": 37, "year": "2014", "title": "Lady Luck", "subtitle": "Vidéomusique", "categories": ["D.A", "film"], "categoriesDisplay": ["D.A", "Réalisatrice"], "categoriesAttr": "D.A film", "image": "", "images": [], "youtubeId": "uLGQh69Z6uI", "link": "", "artiste": "Lulu Gainsbourg", "production": "Suburb / Mercury Music Group", "realisation": "Emilie Chedid", "featuring": "Charly de Witte, Sébastien Pujol, Lilou", "descriptionHtml": "<p>Premier single extrait de l’album Lady Luck de Lulu Gainsbourg, ce titre porte l’empreinte de son goût pour le jeu, le hasard et les destins qui se croisent. Lulu, passionné de poker, y convoque la chance comme moteur narratif et émotionnel. Le clip, tourné au Bus Palladium, lieu mythique de la nuit et de la musique parisiennes, prolonge l’univers de l’album : élégant, joueur, nocturne, entre héritage assumé et liberté personnelle.</p>", "ficheHtml": "<p>Avec Lulu &amp; Lilou / Alain BOUZIGUES / Mathieu GARNIER / Sébastien PUJOL / Charly DE WITTE / Françoise SMILENKO / Chantal PFAFF / Juliette PITRON / Lisa GASSMAN / Zoé FUGER / Marilou MALO / Louise DECOUFLÉ / Gandhi JEDDI / Lionel GRAGY / Hugo HUBERT / Imaêl DUGAIN / Charles ROLLAND V / Arnaud MARTIN / Réalisation &amp; D.A Emilie CHEDID / 1ère assistante réalisation Marjorie MARRAMAQUE / Producteur Frédéric ALENDA / Directeur de production Eric LEPELLETIER / Régisseur Mathieu PASTEUR / Chef opérateur Benjamin CHARTIER / Déco accessoires Pauline REICHENBACH / Chef machiniste Romain RICHE / Stylisme Stéphanie VAILLANT / Chef électricien Edouard ALVERNHE / Maquilleuse Virginie RASCLE / Électricien Benjamin LEMONNYER / Coiffeuse Sandra LAMZABI / Tourné au Café Mansart / Bus Palladium / Montage Aurélien GUÉGAN / Sons additionnels Laurie XHAARD / Umusic Jean-François WANG / Leila MONTANIER / © 2014 Mercury / Universal Music Group</p>", "artistIds": [84, 189, 190, 191, 85, 49, 6]}, {"id": 38, "year": "2014", "title": "Paranoïa", "subtitle": "Vidéomusique", "categories": ["D.A", "film"], "categoriesDisplay": ["D.A", "Réalisatrice"], "categoriesAttr": "D.A film", "image": "", "images": [], "youtubeId": "rg8ZqcqqMV0", "link": "", "artiste": "Joseph Chedid", "production": "Chiips / Maison Rock", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Paranoïa traverse un esprit en déséquilibre. Le film alterne sans repères entre crise et accalmie : Selim enfermé dans une pièce blanche évoquant une cellule d’isolement, où ses gestes griffent, saignent puis noircissent jusqu’à transformer l’espace en tableau abstrait, et des éclats en couleur — un dîner d’amis trop chargé, une parenthèse solaire dans la nature, une séance chez le psy. Monté comme une suite de perceptions, le clip brouille le présent, le souvenir et l’hallucination pour raconter un état plutôt qu’une histoire.</p>", "ficheHtml": "<p>Titre PARANOÏA / Écrit &amp; réalisé Emilie CHEDID / Avec CHAT / Joseph CHEDID / Bénédicte CARTIGNY / Pierre JUAREZ / Bruno VAERMAN / MOZIIMO / Ornella TOWANOU / Anna CHEDID / Quentin LAFFONT / Stéphanie VAILLANT / BLACK Jean-Jacques / Camille FUGER / Morgane AHRACH / Marie LEVRON / Kevin DE LORGERIL / BiG / Musique SELiM (extrait de l’album MAiSON ROCK) / Production CHiiPS / Directrice de production Bénédicte CARTIGNY / Images Sergio PULIDO / Montage Aurélien GUÉGAN / Étalonnage Lionel KOPP / Trucage MO / Sound effects J. CHEDID / Aurélien GUÉGAN / Assistante réalisation Morgane AHRACH / Costumes Stéphanie VAILLANT / Coiffures Charlotte ARGUILLÈRE / Maquillages Mathilde PASSERI / Sarah ATALAH / Décors Jeanne FRENKEL / Chris PERSON / Caroline WATELET / Lumières Hugo HUBERT / Samuel NORIEGA / Machineries Pierre MORSARD / Effets spéciaux Cléo SCHULMANN / Amélie GROSSIER / Régie Arnaud GAVINI / Karine MAURIS / Sabine DUPUIS / La Cantine Clandestine Sophie THOMSEN / Marie LEVRON / Moyens techniques Créative Régie / Damasius / Puzzle Vidéo / 7ème Sens / , "production": "La Bohème films / Barclay Universal Music ", "realisation": "Emilie Chedid, -M-", "featuring": "", "descriptionHtml": "<p>“Pour être, la poésie n’attend que notre regard.” Andrée Chedid \nEn ouverture du DVD, cette phrase posait un seuil : regarder, et laisser advenir. -M- m’a confié des vidéos personnelles, fragments de route et d’instants saisis au fil des années, encore sans destination. De ces images libres est né un film en diavision : dix-sept expérimentations, une par chanson, comme une suite de petits miroirs. Le split screen met deux plans face à face, parfois en dialogue, parfois en friction, et invente des récits parallèles qui finissent par se rejoindre, se contaminer, se répondre. Une traversée conceptuelle et sensible, qui ouvre, pour chaque morceau, un autre chemin de lecture.\nBande Annonce du DVD.</p>", "ficheHtml": "<p>Réalisation Émilie CHEDID / M / Image M / Production exécutive La Bohème Films / Chargée de production Amandine BOUÉ (assistée de Sandra LOTTERSTEIN) / Montage Émilie CHEDID / Aurélien GUÉGAN / Charles HANNOTTE (assisté de Haydée PARCOLLET) / Infographiste JIT Charles HANNOTTE / Coloristes / truquistes Ghislain RIO / Aurélien GUÉGAN / Direction artistique Émilie CHEDID / Conception graphique Yann ORHAN / Animation graphisme Mohammed ZEMMAR / Illustrations sonores Pierre BOSCHERON / Aurélien GUÉGAN / Moyen technique Caméra Sony Pro HVR A1E / Post-production Ribouka / Badlands / Sylicone (Bénédicte CARTIGNY / Laurent SYLVESTRE / Catherine WARTEL / Christelle BORDAT / Jean DELDUC / Julien CLIMENT / Alexandre REGEFFE) / Encoding &amp; authoring Frédéric CAGAN / Johan VIAENE / Assistance technique Laurent RAJCHENBACH / Crédits musicaux (liste complète ci-dessous) / Producteurs Labo M (M assisté de Gaspard BORGEAUD) / Barclay (Olivier CAILLART / Hélène LEMOINE / Jérôme MARROC-LATOUR / Marie MOUNIER / Olivier DESCROIX / Jocelyn PERROTIN / Damien FISCHETTI / Jean-Charles MARIANI / Thérèsa LE / Valérie FORAY / Isabelle VERNAS ngueries", "subtitle": "DVD", "categories": ["D.A", "image", "dvd", "film", "inédit", "productrice"], "categoriesDisplay": ["D.A", "Image", "Conceptrice DVD", "Réalisatrice", "Inédit", "Productrice"], "categoriesAttr": "D.A image dvd film inédit productrice", "image": "", "images": [], "youtubeId": null, "link": "", "artiste": "ZicZazou", "production": "La Bohème films / Sicalines", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Un DVD conçu et réalisé par Emilie Chedid / Durée 240 min\nFilmé exceptionnellement dans l’ancienne salle des pendus lors du festival Les Rutilants, Brocante Sonore marque une étape rare : il aura fallu 20 ans, 9 spectacles, 4 albums et des milliers de concerts à travers le monde pour découvrir enfin Zic Zazou en DVD. Aboutissement d’une démarche unique, cette création confirme le groupe comme une référence du théâtre musical et célèbre une aventure collective hors norme. Le DVD propose également une recette de musique loufoque, de nombreux bonus, et un documentaire qui révèle l’histoire singulière de cette bande d’amis sur 20 ans, preuve que la force du collectif peut, aujourd’hui encore, accomplir des miracles.</p>", "ficheHtml": "<p>Avec le soutien du FCM et de la SPEDIDAM. La Bohème Films &amp; Sicalines présentent « ZicZazou dans Brocante Sonore &amp; autres dingueries » / DVD conçu &amp; réalisé Emilie CHEDID / Production Emilie CHEDID / Stéphanie CARPENTIER / Direction de production Rémi PRADINAS / Montage Gaël CATHOU / Aurélien GUÉGAN / Artwork Yann ORHAN / Encoding &amp; authoring Gilles CHAVY / Zic ZaZou Michel BERTE (basse, idiophones, téléphone) / Patrice BOINET (batterie, percussions, membranophones) / Pierre DENIS (compositeur, trompette, aérophones) / Alain GRAINE (auteur, chant, trompette, cordophones) / Bruno HIC (trombone, euphonium, lamellaphones) / Jean-François HOËL (compositeur, sax, clarinette, aérophones) / Frédéric OBRY (compositeur, guitare, cordophones) / Hervé MABILLE (compositeur, sax, clavier, idiophones) / François TROUILLET (comédien, clown, trouillophones) / Contenu DVD Brocante Sonore / Zic Zazou / La leçon de musique / Malus / Tournage exceptionnel ancienne salle des pendus (Festival Les Rutilants – puits 9 &amp; 9 bis) / Remerciements Valéry DESMARETS / Gilles BRIAND / leur équipe / les mineurs / Titres interprétés (Brocante Sonore) Tubes et tuyaux (J.-F. Hoël) / La Machine (J.-F. Hoël) / Picnic (J.-F. Hoël) / Ode au travail (J.-F. Hoël) / Wassa (P. Boinet) / Chaises musicales (J.-F. Hoël / A. Graine) / Bébé boléro (J.-F. Hoël) / Balaton (F. Obry) / Le ballon de rouge (H. Mabille) / Pingpongpoelle (H. Mabille) / Gants siffleurs (J.-F. Hoël) / Conques (P. Denis / J.-F. Hoël) / Briques (P. Denis / A. Graine) / Les joyeux bûcherons (J.-F. Hoël) / La vie ouvrière (J.-F. Hoël) / Bucheroncoda (J.-F. Hoël) / Shamalamalaïes (F. Obry) / © 2007 La Bohème Films / Sicalines – Tous droits réservés.</p>", "artistIds": [154, 93, 155, 6]}, {"id": 47, "year": "2007", "title": "Petite pute", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "inédit", "productrice", "illustration"], "categoriesDisplay": ["D.A", "Réalisatrice", "Inédit", "Productrice", "Illustratrice"], "categoriesAttr": "D.A film inédit productrice illustration", "image": "", "images": [], "youtubeId": "n_bwKuvK5t0", "link": "", "artiste": "Austine", "production": "La Bohème films / Third side records", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>À Paris, j’ai rencontré Michel Nassif : d’origine libanaise comme moi, nous avons découvert que nos grands-parents étaient amis. À l’époque, il produisait Austine au sein de son label. De cette rencontre est née l’envie de revenir au dessin et de me replonger dans l’animation 2D. Le film prend la forme d’un cadavre exquis visuel, mêlant dessin et prises de vues réelles, où les images s’assemblent et se transforment pour raconter autrement.</p>", "ficheHtml": "<p>Production exécutive Emilie CHEDID / La Bohème Films / Réalisation &amp; dessin Emilie CHEDID / Chef opérateur Martin DE CHABANEIX / Maquillage Charlotte ARGUILLÈRE / Sylvaine CHESNE / Stylisme Emilie HAMON / Montage &amp; étalonnage Aurélien GUÉGAN / Coordinateur de production Stéphane AUBIN / Directeur de production Rémi PRADINAS / Assistante production Justine SEMENTZEFF / Vocals / backing vocals / guitar Austine / Drums Jean THÉVENIN / Guitar / ukulele / organ / body percussion Robin LEDUC / Producer Cocosuma / Robin LEDUC / Programmed by / synthesizer Michel NASSIF / Trumpet / bugle Thibault RENARD / © 2007 La Bohème Films / 3rd Side Records</p>", "artistIds": [92, 93, 94, 6]}, {"id": 48, "year": "2007", "title": "Farewell Angel", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "oRv5Vq5saH0", "link": "", "artiste": "Karlex", "production": "La Bohème films", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>L'artiste haïtiano-américain Karlex présente son nouveau clip pour la chanson « Farewell Angel ». Ce single est extrait de l'album afro-groove « Ghetto Fabulous », qui rencontre un vif succès et attire les foules à travers l'Europe.</p>", "ficheHtml": "<p>Production La bohème films / Productrice Emilie CHEDID / Réalisation Emilie CHEDID / Direction de production Rémi PRADINAS / Direction de la photographie Matthieu NORMAND / Montage BADLANDS – Aurélien GUEGAN / Artiste KARLEX Antoine / Production DARUMA – Philippe / Management Gina CHINN</p>", "artistIds": [95, 93, 6]}, {"id": 49, "year": "2007", "title": "Les leçons de musique", "subtitle": "DVD intéractif", "categories": ["D.A", "dvd", "film", "inédit", "productrice"], "categoriesDisplay": ["D.A", "Conceptrice DVD", "Réalisatrice", "Inédit", "Productrice"], "categoriesAttr": "D.A dvd film inédit productrice", "image": "", "images": [], "youtubeId": "aBNxFPLlklk", "link": "", "artiste": "Maxime Le Forestier, joue Brassens", "production": "La Bohème films / Polydor-Universal Music France", "realisation": "Emilie Chedid", "featuring": "Maxime Le Forestier, Joël Favreau, Pierre Onteniente, Louis-Jean Calvet", "descriptionHtml": "<p>Maxime Le Forestier nous fait découvrir l’univers musical de Georges Brassens. Bénéficiez des meilleurs conseils de l'artiste à la guitare dans un cours vivant et original. Abordez la pratique à travers 12 versions inédites des chansons de Brassens.\nEn bonus, des entretiens de Maxime Le Forestier avec Joël Favreau (dernier guitariste de Brassens), Pierre Onteniente (dit \"Gibraltar\", le secrétaire de Brassens), un making of du tournage et un extrait génial d'une émission diffusée en 1975 chez Favino (le luthier de Brassens).\nSans oublier le dictionnaire et la participation exceptionnelle de Louis-Jean Calvet (linguiste et biographe) qui nous éclairent sur l'écriture des textes et les expressions de Georges Brassens. Durée 180mn. Extrait du DVD - titre Le Gorille.</p>", "ficheHtml": "<p>Interprétation\nMaxime Le Forestier</p>\n<p>Avec la participation de              <br />\nLouis-Jean CALVET\nJoël FAVREAU\nPierre ONTENIENTE  dit « Gibraltar »  </p>\n<p>Équipe Polydor\nJean-Philippe Allard, Chiquito, Aurélie Ullrich, Éric Lelievre, Sylvie Del Pozo, Nitsan Sayag, Laurence Polis, Étienne Perreau, Steeve Populo, Viviane Mir, Philippe Zouari.</p>\n<p>Production\nLA BOHÈME FILMS\nÉmilie Chedid\nJean-Philippe Reza</p>\n<p>Directeur de production &amp; postproduction\nRémi Pradinas</p>\n<p>Assistant de production &amp; postproduction\nStéphane Aubin</p>\n<p>Stagiaire de production\nSonia Mosbah</p>\n<p>Réalisation &amp; direction artistique\nÉmilie Chedid</p>\n<p>Assistant de réalisation\nBenjamin Blanc</p>\n<p>Scripte\nCéline Lepêcheur</p>\n<p>Directeur de la photographie\nDylan Doyle</p>\n<p>Assistants caméra\nMatthieu Normand\nStéphane Aupetit</p>\n<p>Chef électricien\nAmida Belgharbi\nÉlectricien\nJean-Christophe Frendo</p>\n<p>Maquillage\nCharlotte Arguillère</p>\n<p>Chef décorateur\nThomas Viscogliosi</p>\n<p>Assistant décorateur\nMarco Melaragni</p>\n<p>Studio\nTrianon Hall\nCoco &amp; Co</p>\n<p>Ingénieur du son (musique)\nJérôme Kerner</p>\n<p>Assistant son\nFlorent Pottier</p>\n<p>Régisseur général\nYann Girard</p>\n<p>Régisseurs\nBeryl Koltz\nThomas Cirade\nJean-Marc Dewailly</p>\n<p>Montage &amp; étalonnage\nBADLANDS\nAurélien Guégan</p>\n<p>Relevés &amp; tablatures\nBOOKMAKERS\nPatrick Moulou, Philippe Baron, Daniela Grubisic</p>\n<p>Graphisme / dessin / animation\nDAM — Des Animaux Mécaniques\nYann Orhan</p>\n<p>Infographie &amp; truquage\nDAM — Des Animaux Mécaniques\nGilles Chavy</p>\n<p>Direction artistique (musique)\nChiquito</p>\n<p>Mixage\nLaurent Gueneau\nJérôme Kerner</p>\n<p>Mixage bonus\nFrédéric Commault</p>\n<p>Mastering\nDIGITAL ENCODING SYSTEM\nPoussin</p>\n<p>Encoding &amp; authoring\nGilles Chavy</p>\n<p>Suivi comptabilité\nCRED\nChristine Renaud</p>\n<p>Suivi juridique\nSylvain Jaraud\nSarah Forest\nSophie Best\nCatherine Labrosse\nSébastien Branchu</p>\n<p>Moyens techniques\nLa Bohème Films · Badlands · Des Animaux Mécaniques · Trianon Hall · TSF · Assurances Saint Honoré · FLAM · Stricher · Digital Encoding System · Transpalux · Tapages · Tigre · TRM</p>\n<p>Remerciements\nUn grand merci à Georges et Maxime, Rémi, Stéphane, nos Jean-Philippe, Chiquito sans qui rien n’aurait été possible… Sans oublier toute l’équipe de tournage et de postproduction de ce DVD, Karibou et nos family chéries. À Mario Poletti pour l’accès à toutes ses photos. Au Théâtre Alexandre Dumas de Saint-Germain-en-Laye. Ainsi que Rose Léandri pour VMA, Delphine Perichon et Viviane Tasca (Backline), Patrice Desmare (ingénieur du son scène) et Alain Queguiner (luthier de Maxime Le Forestier), les Éditions Universal et Warner, Gaël Marteau (SACEM), Jean Menu (CNC), Freddy Lamotte (FLAM).</p>\n<p>Crédits photos\nArtwork / photo\nYann Orhan</p>\n<p>Assistante photo\nCamille Stoos</p>\n<p>Crédits musicaux\nLa princesse et le croque-notes (G. Brassens – Éditions Musicales 57)\nLe gorille (G. Brassens – Éditions Intersong Paris)\nAuprès de mon arbre (G. Brassens – Éditions Intersong Paris)\nStances à un cambrioleur (G. Brassens – Éditions Musicales 57)\nLa non demande en mariage (G. Brassens – Éditions Musicales 57)\nLes copains d’abord (G. Brassens – Éditions Musicales 57)\nLa religieuse (G. Brassens – Éditions Musicales 57)\nJe me suis fait tout petit (G. Brassens – Éditions Intersong Paris)\nLe testament (G. Brassens – Éditions Intersong Paris)\nDans l’eau de la claire fontaine (G. Brassens – Éditions Musicales 57)\nAu bois de mon cœur (G. Brassens – Éditions Musicales 57)\nLa mauvaise réputation (G. Brassens – Éditions Intersong Paris)\nLe temps ne fait rien à l’affaire (G. Brassens – Éditions Musicales 57)</p>\n<p>Avec la participation du Centre National de la Cinématographie, du Ministère de l’Économie, des Finances et de l’Industrie, et de la SACEM.\n(P) La Bohème Films &amp; Polydor, un label Universal Music France</p>", "artistIds": [108, 147, 108, 192, 193, 194, 93, 78, 6]}, {"id": 50, "year": "2006", "title": "Comme un souffle", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "illustration", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Illustratrice", "Productrice"], "categoriesAttr": "D.A film illustration productrice", "image": "", "images": [], "youtubeId": "HifpBzJUGhE", "link": "", "artiste": "Joseph d'Anvers", "production": "La Bohème films / Atmosphériques", "realisation": "Emilie Chedid", "featuring": "Elisa Allenbach", "descriptionHtml": "<p>Une chanson douce et sensible. Un clip tourné en plan-séquence sur la plage de Strouanne, à Wissant. Une performance en extérieur, face au vent et à la lumière, qui a demandé plusieurs prises pour trouver le juste souffle. Le film est ponctué d’animations 2D traitées au crayon papier un cerf-volant, un papillon, des oiseaux. Des apparitions délicates, presque esquissées, qui prolongent la musique et ouvrent le paysage vers l’imaginaire.</p>", "ficheHtml": "<p>AVEC\nJoseph d’Anvers et Elisa Allenbach</p>\n<p>Production : La Bohème Films\nProducteur exe\nRomain PASCUAL </p>\n<p>Productrice Artistique\nEmilie Chedid</p>\n<p>Réalisation\nEmilie CHEDID</p>\n<p>1er assistant réalisateur\nFranck MORAND</p>\n<p>Direction de production\nRémi PRADINAS</p>\n<p>Assistant de production\nStéphane AUBIN</p>\n<p>Chef opérateur Steadicam\nNicolas DOLLANDER</p>\n<p>Assistant caméra Chef opérateur\nMatthieu NORMAND</p>\n<p>Régie générale\nFabrice BOUSBA</p>\n<p>Régie adjointe\nBaptiste PETIT</p>\n<p>Assistant régie\nLaurent RAJCHENBACH</p>\n<p>Maquillage\nCharlotte ARGUILLERE</p>\n<p>Opérateur playback\nXavier PIROELLE</p>\n<p>Montage BADLANDS\nAurélien GUEGAN</p>\n<p>Animations Sabotage\nGéry Bouchez</p>\n<p>Stagiaire école\nBarnabé POIVEY</p>\n<p>Atmosphériques\nMarc THONON</p>\n<p>Assistante\nCécile</p>\n<p>Cheffe de projet\nCéline ROUBAUD</p>\n<p>Directeur marketing\nThierry PHILLIPON\nLaurent MACHEREY</p>", "artistIds": [4, 195, 93, 89, 6]}, {"id": 51, "year": "2006", "title": "La Bouche", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "1tvCWpQPXTY", "link": "", "artiste": "Mouss et Hakim", "production": "La Bohème films / Atmosphériques", "realisation": "Emilie Chedid", "featuring": "Emilie LE CANU, Svend ANDERSEN, Stéphane AUBIN, Pascal ROCHER", "descriptionHtml": "<p>Qu’est-ce que l’on s’est amusé à tourner ce clip. Mouss et Hakim sont tellement drôles dans ce film. </p>", "ficheHtml": "<p>Artistes Hakim AMOKRANE / Stéphane AMOKRANE / Avec Emilie LE CANU / Svend ANDERSEN / Stéphane AUBIN / Pascal ROCHER / Production exécutive La Bohème Films / Emilie CHEDID / Réalisation &amp; direction artistique Emilie CHEDID / 1er assistant réalisateur Franck MORAND / Direction de production Rémi PRADINAS / Assistant de production Stéphane AUBIN / Stagiaire de production Anna CHEDID / Direction de la photographie Dylan DOYLE / 1er assistant opérateur Matthieu NORMAND / Chef électricien Amida BELGHARBI / Électricien Jérôme FAVRE / Chef machiniste Benoît BOULET / Machiniste Fabien VEILLAS / Régie Hugues DAVEZAC / Erwan HIERNARD / Décors Antoine MARON / Anne PEYRARD / Pascal ERIZABAL / Costumes Valérie SAÏD / Natacha GAUTHIER / Nathalie MESTRES / Maquillage / coiffure / FX Benoît LESTANG / Alexis KINEBARYAN / Florence BATTEAULT / Géraldine KECHICHIAN / Opérateur playback Frédéric COMMAULT / Montage Aurélien GUÉGAN / Atmosphériques Marc THONON / Cécile / Céline ROUBAUD / Thierry PHILLIPON / Laurent MACHEREY</p>", "artistIds": [100, 196, 197, 198, 199, 93, 89, 6]}, {"id": 52, "year": "2006", "title": "Larmes", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "a-bdxx5dkeo", "link": "", "artiste": "Pauline Croze", "production": "La Bohème films / Wagram Music", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Premier clip de cette jeune artiste. Une belle rencontre avec Pauline Croze. Une Artiste sensible, drôle et attachante. </p>", "ficheHtml": "<p>Production exécutive La Bohème Films / Productrice Emilie CHEDID / Réalisation Emilie CHEDID / 1er assistant réalisateur Benjamin BLANC / Directeur de production Romain PASCUAL / Assistant de production Stéphane AUBIN / Stagiaire production Gaël IANNANTUONI / Directeur de la photographie Dylan DOYLE / 1er assistant opérateur Matthieu NORMAND / Chef électricien Amida BELGHARBI / Électricien Charlie AYOUN / Chef machiniste Benoît BOULET / Machiniste Jean-Marc DUPUY / Régisseur général Hugues DAVEZAC / Régisseur Arnaud BOUDET / Chef décorateur Antoine MARON / Assistant décorateur Pascal ERIZABAL / Menuisier traceur Eric LUSSAUD / Chef maquilleuse Charlotte ARGUILLÈRE / Chef monteuse Olivia CHICHÉ / Étalonnage Aline SINQUIN</p>", "artistIds": [101, 93, 45, 6]}, {"id": 53, "year": "2006", "title": "Reine d’un jour", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "cYS3Mydujmc", "link": "", "artiste": "Julie Reins", "production": "La Bohème films / BMG Music Group", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Dans un décor unique, Julie évolue à l’intérieur d’un cube de lumière composé de trois grandes plaques de plexy blanc. Au fil de la chanson, les fonds changent de couleur et d’intensité grâce à une régie lumière pensée comme un instrument rythmique. Le clip détourne avec humour les codes des clips “beauté” déjà vus, en poussant l’interprétation vers le décalage et la caricature. Julie enchaîne costumes et perruques, passant d’une identité à l’autre comme une héroïne multi-facettes. Sur les refrains, son groupe surgit comme une apparition rock’n’roll, ultra typée et volontairement excessive, ponctuant le film de scènes récurrentes et tordantes, entre l’esprit de This Is Spinal Tap et les métamorphoses de La Boum.</p>", "ficheHtml": "<p>Artiste Julie REINS / Musiciens Benjamin TESQUET (basse) / Olivier BRON (guitare) / Pierre-Étienne MICHELIN (batterie) / Roman CHELMINSKI (guitare) / Stephen DISCOURS (clavier) / Production La Bohème Films / Productrice Emilie CHEDID / Directeur de production Rémi PRADINAS / Assistant de production Stéphane AUBIN / Réalisation Emilie CHEDID / 1er assistant réalisation Franck MORAND / Chorégraphie Gladys GAMBIE / Chef opérateur Benjamin CHARTIER / Éclairagiste Vincent IDEZ / 1er assistant caméra Justine BOURGADE / Opérateur playback Emmanuel LEDUC / Chef décoratrice Clotilde AUGOT / Assistant décorateur Thomas VISCOGLIOSI / Chef machiniste Pierre-Yves LEMÉE / Machiniste Jérémie TONDOWSKI / Chef électricien Christophe COÏC / Électricien Thomas VAN KERREBROECK / Régie lumière Nicolas SAVIGNY (pupitreur) / Christophe BEAUP / Fabrice FAUCONNIER / Thomas DE CAMPOS / Maquillage / coiffure Charlotte ARGUILLÈRE (chef maquilleuse) / Alexia BUREAU / Stylisme Natacha GAUTHIER / Philippe BAZIN / Post-production Aurélien GUÉGAN (montage) / Philippe AUBRY (graphisme) / Aline SINQUIN (étalonnage)</p>", "artistIds": [103, 93, 104, 6]}, {"id": 54, "year": "2005", "title": "A tes souhaits", "subtitle": "Making Of", "categories": ["inédit", "productrice"], "categoriesDisplay": ["Inédit", "Productrice"], "categoriesAttr": "inédit productrice", "image": "", "images": [], "youtubeId": "bs22ymqe0RM", "link": "", "artiste": "-M-", "production": "La Bohème films", "realisation": "Valérie Cahour", "featuring": "Cécile de France", "descriptionHtml": "<p>Valérie nous a suivi durant la fabrication de ce film. Un joli souvenir sur lequel je suis retombée récemment. Merci Valérie !</p>", "ficheHtml": "<p>Making Of réalisé par Valérie Cahour \nProduction La Bohème films / Emilie Chedid</p>", "artistIds": [15, 201, 93, 200]}, {"id": 55, "year": "2005", "title": "Mr Bibendum", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "uwAcwcgH5o4", "link": "", "artiste": "Tryo", "production": "La Bohème films / Sony", "realisation": "Emilie Chedid", "featuring": "Sébastien Pujol, Hélène Bosch", "descriptionHtml": "<p>Le groupe interprète Bibendum en avançant, marchant ou dansottant, comme une petite parade. Peu à peu, on comprend qu’ils progressent… sur le corps de Bibou, immense, allongé sur le sable. Leurs silhouettes minuscules traversent ses jambes, son ventre, son bras, sa main, et le film s’amuse avec les perspectives et les rapports d’échelle, à la manière d’un Gulliver renversé. Costumes surprenants, personnages accentués, humour tendre et décalé composent un objet à part, entre l’esprit d’aventure de Time Bandits et la marche chantée du Magicien d’Oz, dans un décor naïf inspiré de l’univers de Grain de sable.</p>", "ficheHtml": "<p>Avec Emmanuel EVENO / Christophe PETIT / Cyril CELESTIN / Daniel BRAVO / Sébastien PUJOL (Bibou) / Hélène BOSCH / Production La Bohème Films / Productrice Emilie CHEDID / Directeur de production Rémi PRADINAS / Assistant de production Stéphane AUBIN / Régie Yann GIRARD (régisseur général) / Sébastien CACHON (régisseur) / Rémy GRANGIER (régisseur face) / Réalisation Emilie CHEDID / 1er assistant réalisation Franck MORAND / Image Benjamin CHARTIER (chef opérateur) / Marianne TARDIEU (2e assistante caméra) / Justine BOURGADE (1re assistante caméra) / Son Eric GERMAIN (opérateur playback) / Décors Clotilde AUGOT (chef décoratrice) / Thomas VISCOGLIOSI / Patrick GARNIER (assistants décorateur) / Machinerie Pierre-Yves LEMÉE (chef machiniste) / J. Marie DUTRAY / Yan RICORD (machinistes) / Électricité Christophe COÏC (chef électricien) / Thomas VAN KERREBROECK / Frédéric LEMAIRE / Tock (électriciens) / Maquillage &amp; coiffure Charlotte ARGUILLÈRE / Stylisme Natacha GAUTHIER (styliste) / Philippe BAZIN (assistant) / Post-production Aurélien GUÉGAN (montage) / Philippe AUBRY (Def To Shoot) / Kathy SEBBAH (making-of)</p>", "artistIds": [105, 190, 203, 93, 106, 6]}, {"id": 56, "year": "2005", "title": "À tes souhaits", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "JiB82tMuEtQ", "link": "", "artiste": "-M-", "production": "Delabel Warner Music / La Bohème films", "realisation": "Emilie Chedid", "featuring": "Cécile de France", "descriptionHtml": "<p>Clip À tes souhaits avec la formidable Cécile de France. Une suite de gros plans comme un face-à-face intime. Le film se concentre sur la présence de Matthieu et de Cécile de France, leurs émotions, leurs silences, leur écoute, en passant sans cesse de l’un à l’autre pendant trois minutes.\nLe clip joue avec les proportions et les perspectives, jusqu’à brouiller l’échelle des corps et des regards : Matthieu en très gros plan, Cécile en silhouette, presque perdue dans l’immensité d’un visage. Quand l’un chante, l’autre écoute, observe, reçoit. Peu à peu, les rôles s’inversent. Spectateur et narrateur se relaient, comme si la chanson circulait entre eux, portée autant par la voix que par le regard.</p>", "ficheHtml": "<p>Avec -M-  et Cécile de France\nRéalisation et Direction Artistique  Emilie Chedid\nProduction La bohème films\nProductrice Emilie Chedid\nAssistant de production Stéphane Aubin\nAssistant réalisateur  Franck Morand\nDirectrice de production  Marie Etchegoyen\nRégisseur : Yann Girard\nChef opérateur : Dominique Fausset\nStylisme : Chris Person</p>", "artistIds": [15, 201, 107, 93, 6]}, {"id": 57, "year": "2004", "title": "Carambar et Abeilles", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "inédit", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Inédit", "Productrice"], "categoriesAttr": "D.A film inédit productrice", "image": "", "images": [], "youtubeId": "SOypedE1gBo", "link": "", "artiste": "Jérémie Kisling", "production": "La Bohème films / Naïve", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Un mini-film à l’humour anglais, tourné dans un atelier déglingue. Jérémy, tee-shirt « Monsieur Obsolète », chante et joue de la guitare avec un sérieux imperturbable, tandis qu’autour de lui de petites actions absurdes s’installent avec ses musiciens. Intriguées, des jeunes femmes entrent, et l’ensemble bascule peu à peu vers une joyeuse danse collective, jusqu’à la chorégraphie finale. Les Abeilles Pensé comme la suite de Carambar, prolonge les deux titres en un mini court-métrage.</p>", "ficheHtml": "<p>Avec Jérémie KISLING (accompagné de Raphaël / Lucas / David) / Camille STOOS / Charlotte DESGEORGES / Flore TAGUIEV / Emilie CANUS / Julia VIGNALI / Production La Bohème Films / Emilie CHEDID / Réalisation &amp; direction artistique Emilie CHEDID / Direction de production Marie ETCHEGOYEN / Chef décoratrice Clotilde AUGOT / Assistant de production Stéphane AUBIN / Régie Yann GIRARD / Montage Aurélien GUÉGAN</p>\n<p>N'hésitez pas à m'envoyer un message pour le reste de l'équipe qui n'est pas créditée !! </p>", "artistIds": [109, 93, 110, 6]}, {"id": 58, "year": "2004", "title": "Ailleurs", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "CkwgugYJFpM", "link": "", "artiste": "Keren Ann", "production": "La Bohème films / EMI Universal Music", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Inspiré des comédies musicales \"Les parapluies de Cherbourg\" et Chantons sous la pluie\". Ce clip est construit en longs plans séquences.</p>", "ficheHtml": "", "artistIds": [111, 93, 112, 6]}, {"id": 59, "year": "2004", "title": "Au coin du monde", "subtitle": "Vidéomusique", "categories": ["D.A", "film", "inédit", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Inédit", "Productrice"], "categoriesAttr": "D.A film inédit productrice", "image": "", "images": [], "youtubeId": "snQy9dR2zoc", "link": "", "artiste": "Keren Ann", "production": "La Bohème films / EMI Universal Music", "realisation": "Emilie Chedid", "featuring": "Thomas Dutronc, Stéphane AUBIN, Franck Morand, Emilie Canus, Anne-Claire BOSCH", "descriptionHtml": "<p>Plan-séquence, filmée en 35 mm, qui bascule progressivement du noir et blanc à la couleur. Dans un décor circulaire construit en studio, une caméra placée au centre tourne à 360° et révèle deux appartements en miroir, séparés par deux portes. Deux fenêtres ouvrent sur le dehors et font glisser les saisons, comme si le temps se pliait à l’intérieur de la pièce. Le making Of retrouvé et inédit permet de comprendre la préparation que demande le tournage d'un plan séquence.</p>", "ficheHtml": "<p>Avec Keren ANN / Thomas DUTRONC / Apparitions Anne-Claire BOSCH / Stéphane AUBIN / Lisa ROZE / Sabrina / Pascale / Emilie CANUS / France / Erwan LAHRER / Séverin / Franck MORAND / David / Laurent / Production exécutive La Bohème Films / Emilie CHEDID / Direction artistique &amp; réalisation Emilie CHEDID / Direction de production Sandrine PAQUOT / Assistant de production Stéphane AUBIN / Assistants réalisateurs Benjamin BLANC / Franck MORAND / DOP Dominique FAUSSET / Chef électricien Rudy BOUCHOUCHA / Décors Antoine MARRON / Tableaux Chris PERSON / VFX Falap / Image making-of Valérie CAHOUR / Montage Aurélien Guégan</p>", "artistIds": [111, 179, 198, 180, 187, 202, 93, 112, 6]}, {"id": 60, "year": "2004", "title": "Les leçons de musique", "subtitle": "DVD intéractif", "categories": ["D.A", "distinction", "dvd", "film", "productrice"], "categoriesDisplay": ["D.A", "Distinction", "Conceptrice DVD", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A distinction dvd film productrice", "image": "", "images": [], "youtubeId": "QbSMi7_w7k8", "link": "", "artiste": "-M-", "production": "La Bohème films / Polydor-Universal Music France", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Vendu à plus de 50 000 exemplaires et Élu meilleur DVD musical aux Victoires de la musique (2005), les \"Leçons de musique de -M-\" est la première édition d'une méthode d'apprentissage de la musique en multi-angles, conçu par Emilie Chedid. On y trouve les meilleurs conseils de l'artiste au chant, à la basse, la guitare et à la batterie et au violoncelle par Vincent Ségal, dans un cours vivant et original. </p>", "ficheHtml": "<p>Coffret DVD musical pédagogique (studio + masterclass + bonus)\n2 DVD (275 mn) ; PAL couleur multi-pistes; Livret 16 pages avec les grilles d'accords, les tablatures et les paroles.</p>\n<p>Production exécutive La Bohème Films / Producteurs Emilie CHEDID / Jean-Philippe REZA / Réalisation Emilie CHEDID / Chef opérateur Dominique FAUSSET / Rudy BOUCHOUCHA / Assistant réalisation Benjamin BLANC / Montage Aurélien GUÉGAN / Olivia CHICHÉ / Création / concept visuel Gilles CHAVY / Photographie &amp; artwork Yann ORHAN / Assistant photo Cyrille GIRARD / Infographie &amp; trucages Gilles CHAVY / Jérémy JUSTICE / Photographe de plateau Chris PERSON / Direction de production Sandrine PAQUOT / Assistant de production Stéphane AUBIN / Régisseur Philippe JARRAUD / Accessoires Clotilde AUGOT / Backline Christophe MERLAUD / Électriciens plateau Christophe BASSOULET / Cédric GUERBY / Techniciens image plateau Adrien PERRAULT / David N’GUÉNOR / Philippe CHAUVEL / Étalonnage Aurélien GUÉGAN / Maxime SOKOLOWSKI / Ingénieur du son musique Olivier LUDE / Ingénieur du son image Jean-Paul GUIRADO / Assistant ingénieur du son Matthias FROIDEFOND / Ingénieur du son voix-off Joseph CHEDID / Mixage Germain BOULAY / Jean-Marc PINAUD / Olivier LUDE / Musique / pédagogie -M- (guitare, voix) / Patrick MOULOU (guitare &amp; pédagogie) / Vincent SEGAL (violoncelle) / Stéphane AUBIN (piano) / Narration -M- / Vincent SEGAL / Patrick MOULOU / Relevés &amp; tablatures Daniela GRUBISIC / Patrick MOULOU / Contenu DVD DVD 1 Les leçons de musique (« La Fleur », « Je dis aime », « Monde virtuel », « Ma mélodie », « La corde sensible ») : accords / riffs / rythmiques / ralentis / guitare 1 &amp; 2 / basse / batterie / piano / violoncelle / paroles / commentaires / DVD 2 Bonus : entretiens -M- / Vincent SEGAL / module « Les notions élémentaires » (Patrick MOULOU) / « Maman Sam » / « L’envers du décor » / « La gamme pentatonique » / « Machistador » / « La boucle » / crédits / Date de sortie 8 novembre 2004</p>", "artistIds": [15, 93, 78, 6]}, {"id": 61, "year": "2003", "title": "Souvenir de Galgon", "subtitle": "Documentaire", "categories": ["distinction", "image", "film"], "categoriesDisplay": ["Distinction", "Image", "Réalisatrice"], "categoriesAttr": "distinction image film", "image": "", "images": [], "youtubeId": null, "link": "", "artiste": "", "production": "Festival d’Asques et d’ailleurs", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Le festival proposait de tourner et monter un film en 48H. Je n'ai malheureusement pas retrouvé le documentaire Souvenir de Galgon qui a reçu le Prix du Jury au Festival d’Asques et d’ailleurs.</p>", "ficheHtml": "", "artistIds": [113, 6]}, {"id": 62, "year": "2001", "title": "Sur le fil & Bright Stones", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "SzbCwu6hEx0", "link": "", "artiste": "Keren Ann", "production": "La Bohème films / EMI Universal Music", "realisation": "Emilie Chedid", "featuring": "Franck Morand", "descriptionHtml": "<p>Sur le fil raconte le trac, ce vertige juste avant d’entrer en scène. Tourné à Prague avec une équipe majoritairement tchèque, l’un de mes premiers tournages à l’étranger, ce diptyque pensé comme un petit court métrage se déploie dans un hôtel à l’atmosphère années 50, lors d’une réception peuplée de visages étranges et délicieusement décalés. Keren Ann vacille, suffoque, s’échappe. L’organisateur fulmine. Plus tard, la grande salle est vide : le public s’est évaporé. Ne restent que le pianiste, les serveurs, le majordome… Et c’est pour eux, dans cette intimité inattendue, qu’elle chante Bright Stones.</p>", "ficheHtml": "<p>Production exécutive La Bohème Films / Réalisation Emilie CHEDID / Directeur de la photographie Dominique FAUSSET / Directeur de production Frédéric ALENDA / 1er assistant réalisateur Franck MORAND / Montage Olivia CHICHÉ / Edit box Jérémy JUSTICE / Graphiste numérique Marc BRUCKERT / Avec Keren Ann ZEIDEL / Franck MORAND/ Ivan JAVAZOV / Jindriska HLOZKOVA / Justine DAVID O’KELLY / Marie KUTCOVA / Marketa KOHNUTOVA / Ivo HATTIK / Elan SPIDIVA / Pavel CERMAK / Petr DRAZNIK / Michal MARA / Petra SUKOVA / Petr POTAC / Pavel SMID / Boris MALINKY / Sans oublier nos complices figurants / l’Hôtel Evropa (Prague) / Directrice de production Vladka LENEROVA / 1er assistant réalisateur Roman FINER / Assistante de production Jana KUDRNACKOVA / Secrétaire de production Dita NOVAKOVA / Casting Petra SVARINSKAB / Maja BUJNAKOVA / Chef costumière Armelle VERENKA / Assistante costume Iveta TRMALOVA / Chef décorateur Petr KAZDA / Assistant décorateur Michal VOKURKA / Chef maquilleur Zdenek FENCEL / Assistantes maquilleur Veronika BABINCOVA / Lenka TROUPALOVA / Assistant opérateur Václav ZAJICEK / Gaffer Ondrej BOCEK / Best boy Jirka FILIPOVSKY / Électriciens Vanek STROCNIK / Tomás BESEDA / Key grip Jan ROENÁK / Retour vidéo Karel HAVELKA / Ingénieur du son Jan STOREK / Régisseur Barbara SMUTNÁ / Drivers Milan MADAR / Renata MADAROVÁ / Camera equipment PANTHER PRAHA / Grip &amp; lights AXIUS / Laboratoire BARRANDOV LABORATOIRE (Prague)/ \nSur le fil &amp; Bright stones - Keren Ann &amp; Benjamin Biolay (éditions dièse)/ \n©2001 EMI music/ La bohème films</p>", "artistIds": [111, 180, 93, 112, 6]}, {"id": 63, "year": "2001", "title": "Bonoboo", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "mgkMkxfq3lE", "link": "", "artiste": "-M-", "production": "La Bohème films / Delabel Warner Music", "realisation": "Emilie Chedid", "featuring": "", "descriptionHtml": "<p>Le clip Bonoboo de -M- s’ouvre sur la voix d’Andrée Chedid, comme une présence tutélaire qui veille et murmure au seuil du récit. L’univers est volontairement en carton-pâte, presque théâtral, avec des références enfantines et un clin d’œil assumé au Magicien d’Oz : couleurs franches, décor fabriqué, illusion revendiquée. Face à -M-, un vieux singe bonobo devient partenaire de jeu, miroir tendre et étrange. C’était mon premier tournage avec un animal, une expérience à la fois imprévisible et magique, où la poésie naît justement de ce fragile équilibre entre maîtrise et hasard.</p>", "ficheHtml": "<p>Production exécutive : La bohème films / Emilie Chedid / Directrice de production Sandrine Paquot/ Réalisation Emilie Chedid /</p>", "artistIds": [15, 93, 107, 6]}, {"id": 64, "year": "2001", "title": "Oui peut-être", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "aHdDD3uC6p8", "link": "", "artiste": "Tanger", "production": "La Bohème films / Mercury Music Group", "realisation": "Emilie Chedid", "featuring": "Philippe Pigeard", "descriptionHtml": "<p>Issu de l’album Détroit (2000), Oui, peut-être s’inscrit dans une période d’expérimentation joyeuse et libre. Pour ce clip, j’ai imaginé un univers aux accents dadaïstes : un décor hybride, fait de projections et d’éléments fabriqués, où le réel et l’illusion se répondent. Deux comédiennes y incarnent une danse de la jalousie, à la fois théâtrale et ludique, dans un jeu de regards et de gestes presque chorégraphié. J’ai adoré ce morceau autant que le film : il y a dans cette création une énergie décalée, une liberté formelle et un goût du collage qui me ressemblent profondément.</p>", "ficheHtml": "<p>Production exécutive : La bohème films / Emilie Chedid / Directrice de production Sandrine Paquot/ Réalisation Emilie Chedid / Cheffe opératrice Béatrice Mizrahi. / Oui, peut-être issu de l’album Détroit (2000). Tanger est un groupe de rock français formé en 1992 par Philippe Pigeard, Christophe Van Huffel, Didier Perrin, Tolga Arslan et Thomas Mouzard. </p>", "artistIds": [115, 204, 93, 49, 6]}, {"id": 65, "year": "2001", "title": "Corn Flakes", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "LU6ikNVxe9g", "link": "", "artiste": "-M-", "production": "La Bohème films / Delabel Warner Music", "realisation": "Emilie Chedid", "featuring": "Anna Chedid, Joseph Chedid", "descriptionHtml": "<p>Dans le clip Corn Flakes de -M-, j’ai voulu replonger dans notre adolescence à Matthieu et moi. Pour nous incarner à l’écran, le choix était évident : Anna et Joseph, nos frère et sœur, dont l’âge et la ressemblance rendaient le jeu presque troublant. Le film est traversé de références aux années 80, esthétique, vêtements, énergie, avec quelques clins d’œil assumés aux Beatles, à Diva, à Hendrix… Un collage de souvenirs, d’images fantasmées et de fragments intimes, comme une capsule temporelle où l’enfance et la musique se mêlent dans une nostalgie joyeuse.</p>", "ficheHtml": "<p>Production exécutive : La bohème films / Emilie Chedid / Directrice de production Sandrine Paquot/ Réalisation Emilie Chedid / Make up-Coiffure : Charlotte Arguillère</p>", "artistIds": [15, 157, 143, 93, 107, 6]}, {"id": 66, "year": "2001", "title": "Le Tour de M", "subtitle": "DVD", "categories": ["D.A", "film", "productrice"], "categoriesDisplay": ["D.A", "Réalisatrice", "Productrice"], "categoriesAttr": "D.A film productrice", "image": "", "images": [], "youtubeId": "muTmHqDgDLc", "link": "", "artiste": "", "production": "La Bohème films / Delabel Warner Music", "realisation": "Emilie Chedid", "featuring": "Vincent Ségal, Cyril Atef", "descriptionHtml": "<p>Le Tour de -M- est le premier album live de Matthieu Chedid. Sorti en janvier 2002, le DVD retrace la tournée précédente et capture l’énergie scénique et la musicalité hors pair de Matthieu et de ses musiciens. J’ai réalisé la captation, les bonus, et j’ai aussi imaginé la direction artistique du DVD.</p>\n<p>À l’époque, l’authoring et l’encodage DVD n’étaient pas encore totalement au point en France. La maison de disques m’a donc envoyée chez Metropolis, à New York, pour finaliser cette partie pendant trois semaines. Je suis arrivée à Manhattan le 9 septembre 2001, surexcitée à l’idée de vivre cette aventure professionnelle au cœur de New York.</p>\n<p>La veille au soir, je dormais chez une amie photographe à Manhattan. Le lendemain, elle exposait dans un café en bas de chez elle, et j’avais prévu de l’aider à accrocher ses photos tôt le matin. C’est là, dans ce lieu banal et familier, que le premier avion a percuté la tour. Le barman a sorti une petite télévision et l’a posée sur le comptoir. On a tous regardé l’écran, sidérés, comme si l’image n’était pas réelle, une scène surréaliste, impossible à comprendre.</p>\n<p>Quand le deuxième avion a frappé, la panique a envahi la rue. Des gens couraient, couverts de poussière et parfois de sang. Le chaos était total.</p>\n<p>Mon premier rendez-vous chez Metropolitan DVD a eu lieu quelques jours plus tard, je crois le jeudi 13 septembre, et il avait quelque chose d’irréel. Les locaux étaient presque vides. Le technicien qui m’a accueillie avait une tête cadavérique. On a regardé rapidement les éléments, puis je suis repartie : il m’a fait comprendre, sans même avoir besoin de le dire, que ce n’était pas le moment de rester, que ma présence à ses côtés n’avait pas vraiment de sens.</p>\n<p>Les semaines qui ont suivi, j’ai vécu entre Manhattan et Brooklyn, dans une ville suspendue, traversée par le choc, la peur, le silence et une étrange sidération. Cette expérience reste gravée en moi pour toujours, et elle accompagne, à sa manière, l’histoire de ce DVD.</p>", "ficheHtml": "<p>Format DV &amp; Super 8 - 180mn\nTournage à 12 caméras à L'Olympia + Bonus\nDirecteur de la photographie Dominique FAUSSET / Chef monteuse Olivia CHICHÉ / Scripte Florence LECUYER / Directeur de production Frédéric ALENDA / Son Olivier LUDE / Création DVD Metropolitan DVD – NY – USA / Production exécutive La Bohème Films</p>", "artistIds": [210, 209, 93, 107, 6]}, {"id": 67, "year": "2000", "title": "Seule", "subtitle": "Vidéomusique", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": "PbpODAzTrYo", "link": "", "artiste": "Keren Ann", "production": "La Bohème films / EMI Universal Music", "realisation": "Emilie Chedid", "featuring": "Arié ELMALÉH", "descriptionHtml": "<p>Clip Seule pour Keren Ann.</p>", "ficheHtml": "<p>Format 16mm Couleur - Durée 3mn30\nAvec Keren ANN / Arié ELMALÉH / Madeleine LECHOUX / Anthony BASTIE / Victor DE OLIVEIRA / Production exécutive La Bohème Films / Productrice Emilie CHEDID /  Directeur de la photographie Franck TIMEZUK / Chef monteur Olivier GAJAN / Chef décorateur Christophe THIOLLIER / Stylisme Natacha GAUTHIER / Maquillage &amp; coiffure Valérie HAMEL / Direction de production Sandrine PAQUOT</p>", "artistIds": [111, 212, 93, 112, 6]}, {"id": 68, "year": "2000", "title": "Du baptême à je dis M", "subtitle": "Documentaire", "categories": ["film", "productrice"], "categoriesDisplay": ["Réalisatrice", "Productrice"], "categoriesAttr": "film productrice", "image": "", "images": [], "youtubeId": null, "link": "", "artiste": "-M-", "production": "La Bohème films / Delabel Warner Music / Le Village", "realisation": "Emilie Chedid", "featuring": "Vincent Ségal, Cyril Atef, DJ Shalom, Olivier Lude, Alain Bashung, Charlélie Couture, Louis Chedid, Lisa Roze, Cyril Houplain, Mathieu Boogaerts, Dom Elalouf, Maxime GAROUTE, Philippe Zdar, Pierre Boscheron, Thomas Dutronc, Vanessa Paradis, Céline B., Alex Gopher", "descriptionHtml": "<p>Du baptême à je dis M. Le tout premier documentaire qui retrace les deux premiers albums de -M-.</p>", "ficheHtml": "<p>FORMAT : DV / Super 8 mm / Super 16 / Beta Num - Durée 52 mn\nDiffuseurs : Paris Première / Planète / Canal + Belgique      <br />\nAvec Alain BASHUNG / Alex GOPHER / Céline B. / CharlÉlie COUTURE
