body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: 'Oswald', sans-serif;
    overscroll-behavior: none;
}
#canvas-container {
    width: 100vw;
    height: 100vh;
    touch-action: none;
    -ms-touch-action: none;
    overscroll-behavior: none;
}
#canvas-container canvas {
    touch-action: none;
    -ms-touch-action: none;
}
/* Explorer Toolbar */
.explorer-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: none;
    border-bottom: none;
    z-index: 100;
}
.toolbar-title {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: #fff;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    flex-shrink: 0;
}
.toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent;
    color: #ccc;
    cursor: pointer;
    font-size: 0.75rem;
    font-family: 'Oswald', Arial, sans-serif;
    font-weight: 400;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-decoration: none;
    flex-shrink: 0;
}
.toolbar-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #fff;
    color: #fff;
}
.toolbar-btn-active {
    background: #fff;
    color: #000;
    border-color: #fff;
}
.toolbar-btn-active:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
}
.info-panel {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 0.9rem;
    text-align: center;
    z-index: 100;
}
.legend {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 0.8rem;
    color: #666;
    z-index: 100;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
}
.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}
.dot.cat { background: #007a5e; }
.dot.art { background: #d6532e; }
.dot.year { background: #e5e3cc; }
.dot.title { background: #eef070; }
@media (max-width: 768px) {
    .legend {
        display: none;
    }
    .info-panel {
        font-size: 0.8rem;
        bottom: 10px;
    }
}
/* Audio Popup */
.audio-popup {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 150;
    opacity: 0;
    animation: fadeInUp 0.5s ease forwards;
    animation-delay: 1s;
}
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}
.audio-popup.hidden {
    animation: fadeOut 0.3s ease forwards;
}
@keyframes fadeOut {
    to {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }
}
.audio-popup-content {
    background: rgba(30, 30, 30, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.audio-popup-text {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: #fff;
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
    font-weight: 300;
}
.audio-popup-icon {
    font-size: 1.5rem;
}
.audio-popup-buttons {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
}
.audio-popup-btn {
    padding: 0.5rem 1.25rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: 'Oswald', Arial, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    border-radius: 4px;
}
.audio-popup-accept {
    background: rgba(255, 255, 255, 0.1);
}
.audio-popup-accept:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
}
.audio-popup-decline:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #fff;
}

            const currentX = star.startPos.x + (star.endPos.x - star.startPos.x) * progress;
            const currentY = star.startPos.y + (star.endPos.y - star.startPos.y) * progress;
            const currentZ = star.startPos.z + (star.endPos.z - star.startPos.z) * progress;

            // Calculate direction vector for trail
            const dirX = star.endPos.x - star.startPos.x;
            const dirY = star.endPos.y - star.startPos.y;
            const dirZ = star.endPos.z - star.startPos.z;
            const dirLength = Math.sqrt(dirX * dirX + dirY * dirY + dirZ * dirZ);
            const normDirX = dirX / dirLength;
            const normDirY = dirY / dirLength;
            const normDirZ = dirZ / dirLength;

            // Tail position (behind the head)
            const trailProgress = Math.max(0, progress - 0.15); // Trail lags behind
            const tailX = star.startPos.x + (star.endPos.x - star.startPos.x) * trailProgress;
            const tailY = star.startPos.y + (star.endPos.y - star.startPos.y) * trailProgress;
            const tailZ = star.startPos.z + (star.endPos.z - star.startPos.z) * trailProgress;

            // Update line geometry
            const positions = star.line.geometry.attributes.position.array;
            positions[0] = tailX;
            positions[1] = tailY;
            positions[2] = tailZ;
            positions[3] = currentX;
            positions[4] = currentY;
            positions[5] = currentZ;
            star.line.geometry.attributes.position.needsUpdate = true;

            // Fade out at the end
            if (progress > 0.8) {
                star.line.material.opacity = 0.8 * (1 - (progress - 0.8) / 0.2);
            }
        }
    }

    // Animation state
    let animationStartTime = null;
    let isAnimating = (ANIMATION_MODE !== 'none');
    let animationPhase = 'grow';  // 'grow' or 'fadeIn' (for stars)
    const targetScale = 1;

    // Start with scale 0 if animating
    if (isAnimating) {
        sphereGroup.scale.set(0.001, 0.001, 0.001);  // Start tiny (not 0 to avoid issues)
    }

    // Text sprites
    const textSprites = [];
    const sphereRadius = 10;

    // Colors by type - configurable from settings
    const typeColors = {
        'category': '#007a5e',
        'artist': '#d6532e',
        'year': '#e5e3cc',
        'title': '#eef070'
    };

    // Fonts by type - configurable from settings
    const typeFonts = {
        'category': 'Ubuntu',
        'artist': 'Oswald',
        'year': 'Montserrat',
        'title': 'Raleway'
    };

    // Sizes by type - base font sizes
    const typeSizes = {
        'category': 16,
        'artist': 18,
        'year': 24,
        'title': 16
    };

    // Styles by type (normal, italic, bold, bold italic)
    const typeStyles = {
        'category': 'normal',
        'artist': 'bold italic',
        'year': 'bold',
        'title': 'italic'
    };

    // Helper to build CSS font string
    function buildFontString(type, weightBonus) {
        const baseSize = typeSizes[type] || 20;
        const fontSize = baseSize + (weightBonus || 0) * 3;
        const fontFamily = typeFonts[type] || 'Oswald';
        const style = typeStyles[type] || 'normal';

        let fontStyle = 'normal';
        let fontWeight = 'normal';
        if (style === 'bold') {
            fontWeight = 'bold';
        } else if (style === 'italic') {
            fontStyle = 'italic';
        } else if (style === 'bold italic') {
            fontWeight = 'bold';
            fontStyle = 'italic';
        }

        return fontStyle + ' ' + fontWeight + ' ' + fontSize + 'px ' + fontFamily + ', sans-serif';
    }

    // ========== USE PRE-COMPUTED POSITIONS FROM PYTHON ==========
    const padding = 0;

    // Items already have positions computed by Python
    const placedItems = KEYWORDS.map((kw, idx) => ({
        ...kw,
        idx,
        canvasWidth: Math.ceil(kw.canvas_width),
        canvasHeight: Math.ceil(kw.canvas_height),
        fontSize: kw.font_size,
        phi: kw.phi,
        theta: kw.theta,
        effectiveDPhi: kw.d_phi,
        effectiveDTheta: kw.d_theta,
        rotation: kw.rotation
    }));

    // Star points array (for Stars mode)
    const starPoints = [];

    // Create meshes at computed positions
    placedItems.forEach((item) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // Build the font string with configured size
        const fontString = buildFontString(item.type, item.weight);
        ctx.font = fontString;

        // Measure actual text width with the configured font
        const textMetrics = ctx.measureText(item.text.trim());
        const actualFontSize = (typeSizes[item.type] || 20) + (item.weight || 0) * 3;

        // Calculate canvas dimensions based on actual text size
        // Add extra width for italic fonts (they slant beyond measured width)
        const style = typeStyles[item.type] || 'normal';
        const isItalic = style === 'italic' || style === 'bold italic';
        const italicExtra = isItalic ? actualFontSize * 0.3 : 0;
        const textWidth = textMetrics.width;
        const canvasWidth = Math.ceil(textWidth + italicExtra);
        const canvasHeight = Math.ceil(actualFontSize * 1.2);

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // Re-apply font after canvas resize (canvas resize clears context)
        ctx.font = fontString;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = typeColors[item.type] || '#1a1a1a';
        ctx.fillText(item.text.trim(), canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        // Calculate world dimensions from canvas size (using same scale factor as Python)
        const scaleFactor = 0.027;  // Approximate scale from Python optimization
        const worldWidth = canvasWidth * scaleFactor;
        const worldHeight = canvasHeight * scaleFactor;

        // Create curved geometry with recalculated dimensions
        const widthSegments = Math.max(8, Math.ceil(worldWidth / 0.5));
        const heightSegments = Math.max(2, Math.ceil(worldHeight / 0.5));
        const geometry = new THREE.PlaneGeometry(worldWidth, worldHeight, widthSegments, heightSegments);

        const phi = item.phi;
        const theta = item.theta;
        const rotation = item.rotation;  // 0, 45, 90, or -45 degrees

        // Curve the geometry to follow the sphere surface
        const positionAttr = geometry.attributes.position;
        const rotationRad = rotation * Math.PI / 180;
        const cosR = Math.cos(rotationRad);
        const sinR = Math.sin(rotationRad);

        for (let v = 0; v < positionAttr.count; v++) {
            let localX = positionAttr.getX(v);
            let localY = positionAttr.getY(v);

            // Apply rotation to local coordinates
            const rotatedX = localX * cosR - localY * sinR;
            const rotatedY = localX * sinR + localY * cosR;

            // Map rotated coordinates to sphere deltas
            // Negate theta for correct text direction
            const deltaTheta = -rotatedX / sphereRadius;
            const deltaPhi = -rotatedY / sphereRadius;

            const newPhi = phi + deltaPhi;
            const newTheta = theta + deltaTheta / Math.sin(Math.max(0.1, phi));
            const textRadius = sphereRadius + 0.05;

            // Poles on Y axis (vertical)
            const nx = textRadius * Math.sin(newPhi) * Math.cos(newTheta);
            const ny = textRadius * Math.cos(newPhi);
            const nz = textRadius * Math.sin(newPhi) * Math.sin(newTheta);

            positionAttr.setXYZ(v, nx, ny, nz);
        }

        positionAttr.needsUpdate = true;
        geometry.computeVertexNormals();

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData = { link: item.link, type: item.type, text: item.text };
        textSprites.push(mesh);
        sphereGroup.add(mesh);

        // Always create star points (for test panel to work with any initial mode)
        // Create a glowing star point at the center of this label
        const pointPhi = item.phi;
        const pointTheta = item.theta;
        const pointRadius = sphereRadius + 0.1;

        // Calculate center position
        const px = pointRadius * Math.sin(pointPhi) * Math.cos(pointTheta);
        const py = pointRadius * Math.cos(pointPhi);
        const pz = pointRadius * Math.sin(pointPhi) * Math.sin(pointTheta);

        // Create glowing point sprite
        const pointCanvas = document.createElement('canvas');
        pointCanvas.width = 64;
        pointCanvas.height = 64;
        const pctx = pointCanvas.getContext('2d');

        // Draw glowing circle with more visible glow
        const gradient = pctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        const color = typeColors[item.type] || '#ffffff';
        gradient.addColorStop(0, '#ffffff');  // Bright white center
        gradient.addColorStop(0.2, color);
        gradient.addColorStop(0.5, color);
        gradient.addColorStop(1, 'transparent');
        pctx.fillStyle = gradient;
        pctx.beginPath();
        pctx.arc(32, 32, 32, 0, Math.PI * 2);
        pctx.fill();

        const pointTexture = new THREE.CanvasTexture(pointCanvas);
        const pointMaterial = new THREE.SpriteMaterial({
            map: pointTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const pointSprite = new THREE.Sprite(pointMaterial);
        pointSprite.position.set(px, py, pz);
        const pointSize = 0.5 + (item.weight || 1) * 0.15;  // Bigger points
        pointSprite.scale.set(pointSize, pointSize, 1);
        pointSprite.userData = { linkedMesh: mesh, type: item.type };
        starPoints.push(pointSprite);
        sphereGroup.add(pointSprite);

        // Initially hide star points and show labels (unless in stars mode)
        if (ANIMATION_MODE === 'stars') {
            material.opacity = 0;
            pointSprite.visible = true;
        } else {
            pointSprite.visible = false;
        }
    });

    // ========== CONNECTION LINES ==========
    // Create luminous lines between related points
    const connectionLines = [];

    // Build lookup maps for efficient connection finding
    const yearIndices = {};  // year value -> index in placedItems
    const categoryIndices = {};  // category value -> index
    const artistIndices = {};  // artist_id -> index

    placedItems.forEach((item, idx) => {
        if (item.type === 'year') {
            yearIndices[item.value || item.text] = idx;
        } else if (item.type === 'category') {
            categoryIndices[item.value] = idx;
        } else if (item.type === 'artist' && item.artist_id) {
            artistIndices[item.artist_id] = idx;
        }
    });

    console.log('Year indices:', yearIndices);
    console.log('Category indices:', categoryIndices);
    console.log('Artist indices:', artistIndices);

    // Create lines from titles to their related keywords
    let totalConnections = 0;
    placedItems.forEach((item, idx) => {
        if (item.type !== 'title') return;

        const titlePoint = starPoints[idx];
        if (!titlePoint) return;

        const connections = [];

        // Connect to year
        if (item.rel_year && yearIndices[item.rel_year] !== undefined) {
            connections.push({ targetIdx: yearIndices[item.rel_year], type: 'year' });
        }

        // Connect to categories
        if (item.rel_categories && Array.isArray(item.rel_categories)) {
            item.rel_categories.forEach(cat => {
                if (categoryIndices[cat] !== undefined) {
                    connections.push({ targetIdx: categoryIndices[cat], type: 'category' });
                }
            });
        }

        // Connect to artists
        if (item.rel_artist_ids && Array.isArray(item.rel_artist_ids)) {
            item.rel_artist_ids.forEach(artistId => {
                if (artistIndices[artistId] !== undefined) {
                    connections.push({ targetIdx: artistIndices[artistId], type: 'artist' });
                }
            });
        }

        // Create line geometries for each connection
        connections.forEach(conn => {
            const targetPoint = starPoints[conn.targetIdx];
            if (!targetPoint) return;

            // Create a curved line using QuadraticBezierCurve3 for a smoother look
            const start = titlePoint.position.clone();
            const end = targetPoint.position.clone();

            // Calculate midpoint and push it outward for a curved effect
            const mid = start.clone().add(end).multiplyScalar(0.5);
            const midRadius = mid.length();
            mid.normalize().multiplyScalar(midRadius * 1.15);  // Push outward 15%

            // Create curve with multiple points
            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            const curvePoints = curve.getPoints(20);

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
            const lineColor = typeColors[conn.type] || '#ffffff';
            const lineMaterial = new THREE.LineBasicMaterial({
                color: lineColor,
                transparent: true,
                opacity: 0.6,
                linewidth: 2.6,
                blending: THREE.AdditiveBlending
            });

            const line = new THREE.Line(lineGeometry, lineMaterial);
            line.userData = { fromIdx: idx, toIdx: conn.targetIdx, type: conn.type };
            connectionLines.push(line);
            sphereGroup.add(line);
            totalConnections++;

            // Initially hide lines unless in stars mode
            if (ANIMATION_MODE !== 'stars') {
                line.visible = false;
            }
        });
    });

    console.log('Total connection lines created:', totalConnections);

    // Drag controls
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };

    // Auto-rotation logic (rotates by default, stops when user interacts)
    let userIsInteracting = false;
    let interactionTimeout = null;
    const INTERACTION_TIMEOUT_DURATION = 2000; // 2 seconds after last interaction
    const AUTO_ROTATION_SPEED = 0.001; // Slow auto-rotation speed

    // Orbit time accumulator (only counts when orbit is active)
    let orbitAccumulatedTime = 0;
    let orbitLastActiveTime = null;

    function markUserInteraction() {
        userIsInteracting = true;
        // Clear any existing timeout
        if (interactionTimeout) {
            clearTimeout(interactionTimeout);
        }
        // Set new timeout to resume auto-rotation
        interactionTimeout = setTimeout(() => {
            userIsInteracting = false;
            rotationVelocity = { x: 0, y: 0 }; // Reset momentum when resuming auto-rotation
        }, INTERACTION_TIMEOUT_DURATION);
    }

    // Zoom with mouse wheel
    renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        cameraZoomDistance += e.deltaY * 0.05;
        // Clamp zoom range
        cameraZoomDistance = Math.max(20, Math.min(80, cameraZoomDistance));
        markUserInteraction();
    }, { passive: false });

    renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
        markUserInteraction();
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            // Rotate around Y axis (yaw) and X axis (pitch)
            sphereGroup.rotation.y += deltaX * 0.005;
            sphereGroup.rotation.x += deltaY * 0.005;

            // Store velocity for momentum
            rotationVelocity = { x: deltaY * 0.0005, y: deltaX * 0.0005 };

            previousMousePosition = { x: e.clientX, y: e.clientY };
            markUserInteraction();
        }
    });

    renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false;
    });

    renderer.domElement.addEventListener('mouseleave', () => {
        isDragging = false;
    });

    // Touch support: one finger = rotate, two fingers = pinch zoom
    let isPinching = false;
    let pinchStartDistance = 0;
    let pinchStartZoomDistance = cameraZoomDistance;
    let suppressTapUntil = 0;
    let singleTouchMoved = false;

    function getTouchDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.hypot(dx, dy);
    }

    renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            isPinching = false;
            singleTouchMoved = false;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            markUserInteraction();
            e.preventDefault();
            return;
        }
        if (e.touches.length === 2) {
            isDragging = false;
            isPinching = true;
            suppressTapUntil = Date.now() + 500;
            pinchStartDistance = getTouchDistance(e.touches[0], e.touches[1]);
            pinchStartZoomDistance = cameraZoomDistance;
            markUserInteraction();
            e.preventDefault();
        }
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
                singleTouchMoved = true;
            }

            // Rotate around Y axis (yaw) and X axis (pitch)
            sphereGroup.rotation.y += deltaX * 0.005;
            sphereGroup.rotation.x += deltaY * 0.005;

            rotationVelocity = { x: deltaY * 0.0005, y: deltaX * 0.0005 };
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            markUserInteraction();
            e.preventDefault();
            return;
        }

        if (isPinching && e.touches.length === 2) {
            const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
            if (pinchStartDistance > 0 && currentDistance > 0) {
                const zoomRatio = pinchStartDistance / currentDistance;
                cameraZoomDistance = pinchStartZoomDistance * zoomRatio;
                cameraZoomDistance = Math.max(20, Math.min(80, cameraZoomDistance));
                markUserInteraction();
            }
            e.preventDefault();
        }
    }, { passive: false });

    renderer.domElement.addEventListener('touchend', (e) => {
        if (isPinching || e.changedTouches.length > 1) {
            suppressTapUntil = Date.now() + 500;
        }
        if (e.touches.length === 0) {
            isDragging = false;
            isPinching = false;
        } else if (e.touches.length === 1) {
            isPinching = false;
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        e.preventDefault();
    }, { passive: false });

    // iOS Safari gesture events (non-standard): block browser-level pinch zoom.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((evt) => {
        renderer.domElement.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
    });

    // Raycaster for click detection
    const raycaster = new THREE.Raycaster();
    raycaster.params.Sprite.threshold = 0.5;

    function onPointerClick(event) {
        if (Date.now() < suppressTapUntil || isPinching) return;
        // Ignore if we were dragging
        if (Math.abs(rotationVelocity.x) > 0.001 || Math.abs(rotationVelocity.y) > 0.001) return;

        const clientX = event.clientX || (event.changedTouches && event.changedTouches[0].clientX);
        const clientY = event.clientY || (event.changedTouches && event.changedTouches[0].clientY);

        const mouse = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
        );

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(textSprites);

        if (intersects.length > 0) {
            const clicked = intersects[0].object;
            window.location.href = clicked.userData.link;
        }
    }

    // Double-click to navigate
    renderer.domElement.addEventListener('dblclick', onPointerClick);

    // Double-tap for touch devices
    let lastTap = 0;
    renderer.domElement.addEventListener('touchend', (e) => {
        if (Date.now() < suppressTapUntil || singleTouchMoved || isPinching) {
            lastTap = 0;
            return;
        }
        if (!e.changedTouches || e.changedTouches.length !== 1) {
            lastTap = 0;
            return;
        }
        const now = Date.now();
        if (now - lastTap < 300) {
            onPointerClick(e);
        }
        lastTap = now;
    });

    // Hover effect
    let hoveredSprite = null;
    const infoPanel = document.getElementById('info-panel');

    function onPointerMove(event) {
        const clientX = event.clientX || (event.touches && event.touches[0].clientX);
        const clientY = event.clientY || (event.touches && event.touches[0].clientY);

        const mouse = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
        );

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(textSprites);

        if (intersects.length > 0) {
            const sprite = intersects[0].object;
            if (hoveredSprite !== sprite) {
                hoveredSprite = sprite;
                renderer.domElement.style.cursor = 'pointer';
                infoPanel.textContent = sprite.userData.text;
            }
        } else {
            if (hoveredSprite) {
                hoveredSprite = null;
                renderer.domElement.style.cursor = 'grab';
                infoPanel.textContent = 'Glissez pour tourner • Molette pour zoomer • Double-clic pour ouvrir';
            }
        }
    }

    renderer.domElement.addEventListener('mousemove', onPointerMove);
    renderer.domElement.style.cursor = 'grab';

    // Easing function for smooth animation
    function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
    }

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();

        // Handle animation phases
        if (isAnimating) {
            if (animationStartTime === null) {
                animationStartTime = now;
            }

            const elapsed = now - animationStartTime;
            const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            const easedProgress = easeOutCubic(progress);

            if (animationPhase === 'grow') {
                // Scale animation (both Growth and Stars modes)
                const scale = 0.001 + easedProgress * (targetScale - 0.001);
                sphereGroup.scale.set(scale, scale, scale);

                // Rotate during growth animation with progressive slowdown
                // Full speed until 80%, then decelerate smoothly to stop
                let rotationSpeed = 0.05;
                if (progress > 0.8) {
                    // Ease out the last 20%: map 0.8-1.0 to 1.0-0.0
                    const slowdownProgress = (progress - 0.8) / 0.2;
                    rotationSpeed *= (1 - easeOutCubic(slowdownProgress));
                }

                if (ROTATION_AXIS === 'x') {
                    sphereGroup.rotation.x += rotationSpeed;
                } else if (ROTATION_AXIS === 'z') {
                    sphereGroup.rotation.z += rotationSpeed;
                } else {
                    sphereGroup.rotation.y += rotationSpeed;  // Default Y
                }

                // Check if grow phase is complete
                if (progress >= 1) {
                    sphereGroup.scale.set(1, 1, 1);

                    if (ANIMATION_MODE === 'stars') {
                        // Move to fade-in phase for labels
                        animationPhase = 'fadeIn';
                        animationStartTime = now;
                    } else {
                        // Growth mode complete
                        isAnimating = false;
                    }
                }
            } else if (animationPhase === 'fadeIn') {
                // Fade in labels (Stars mode only)
                const fadeProgress = Math.min(elapsed / LABEL_FADE_DURATION, 1);

                textSprites.forEach(mesh => {
                    mesh.material.opacity = fadeProgress;
                });

                // Fade out star points and connection lines
                starPoints.forEach(point => {
                    point.material.opacity = 1 - fadeProgress * 0.7;  // Keep some visibility
                });

                // Fade out connection lines
                connectionLines.forEach(line => {
                    line.material.opacity = 0.4 * (1 - fadeProgress * 0.8);
                });

                if (fadeProgress >= 1) {
                    isAnimating = false;
                }
            }
        }

        // Apply rotation logic when not dragging (and not animating)
        if (!isDragging && !isAnimating) {
            if (userIsInteracting) {
                // User is interacting: apply momentum with friction
                sphereGroup.rotation.x += rotationVelocity.x;
                sphereGroup.rotation.y += rotationVelocity.y;
                rotationVelocity.x *= 0.96;
                rotationVelocity.y *= 0.96;
            } else {
                // User not interacting: apply auto-rotation (default behavior)
                sphereGroup.rotation.y += AUTO_ROTATION_SPEED;
            }
        }

        // Animate background stars (brightness cycle)
        backgroundStars.forEach(star => {
            // Use cycleOffset to ensure each star has unique phase
            const cycleTime = (now + star.cycleOffset) % STAR_BRIGHTNESS_CYCLE;
            const progress = cycleTime / STAR_BRIGHTNESS_CYCLE; // 0 to 1

            // Calculate brightness: 0 → 1 → 0 (sine wave)
            const brightness = Math.sin(progress * Math.PI);
            star.sprite.material.opacity = brightness;
        });

        // Update shooting stars
        updateShootingStars(now);

        // Sphere orbital movement (pause when user interacts, same rules as rotation)
        if (SPHERE_ORBIT_ENABLED && !isDragging && !userIsInteracting) {
            // Accumulate time only when orbit is active (no jumps on resume)
            if (orbitLastActiveTime === null) {
                orbitLastActiveTime = now;
            }
            const deltaTime = now - orbitLastActiveTime;
            orbitAccumulatedTime += deltaTime;
            orbitLastActiveTime = now;

            const angle = (orbitAccumulatedTime / SPHERE_ORBIT_PERIOD) * Math.PI * 2;
            sphereGroup.position.x = SPHERE_ORBIT_RADIUS_X * Math.cos(angle);
            sphereGroup.position.y = SPHERE_ORBIT_Y_OFFSET;
            // Move in depth while moving horizontally so sphere appears to grow/shrink.
            sphereGroup.position.z = SPHERE_ORBIT_Z_OFFSET + SPHERE_ORBIT_Z_AMPLITUDE * Math.cos(angle);
        } else {
            // Orbit is paused, reset timer so it resumes from current position
            orbitLastActiveTime = null;
        }

        // Apply zoom distance updated by wheel before rendering.
        camera.position.z = cameraZoomDistance;
        renderer.render(scene, camera);
    }
    // animate() is now called conditionally at the end

    // Responsive
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== TEST PANEL CONTROLS ==========
    let currentMode = ANIMATION_MODE;
    let currentAxis = ROTATION_AXIS;
    let currentDuration = ANIMATION_DURATION;

    function resetAndPlayAnimation(mode, axis) {
        currentMode = mode;
        currentAxis = axis || currentAxis;

        // Update UI
        document.getElementById('current-mode').textContent = mode;
        document.getElementById('current-axis').textContent = currentAxis.toUpperCase();

        // Update button states
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.axis === currentAxis);
        });

        // Reset sphere state
        sphereGroup.scale.set(0.001, 0.001, 0.001);
        sphereGroup.rotation.set(0, 0, 0);
        rotationVelocity = { x: 0, y: 0 };

        // Reset labels, star points, and connection lines based on mode
        if (mode === 'stars') {
            // Hide labels, show stars and lines
            textSprites.forEach(mesh => {
                mesh.material.opacity = 0;
            });
            starPoints.forEach(point => {
                point.material.opacity = 1;
                point.visible = true;
            });
            connectionLines.forEach(line => {
                line.material.opacity = 0.4;
                line.visible = true;
            });
        } else {
            // Show labels, hide stars and lines
            textSprites.forEach(mesh => {
                mesh.material.opacity = 1;
            });
            starPoints.forEach(point => {
                point.visible = false;
            });
            connectionLines.forEach(line => {
                line.visible = false;
            });
        }

        // Start animation
        if (mode !== 'none') {
            animationStartTime = null;
            animationPhase = 'grow';
            isAnimating = true;
        } else {
            // No animation - just show at full scale
            sphereGroup.scale.set(1, 1, 1);
            isAnimating = false;
        }
    }

    // Override animation axis in the loop
    const originalAnimate = animate;
    function animateWithDynamicAxis() {
        requestAnimationFrame(animateWithDynamicAxis);
        const now = performance.now();

        if (isAnimating) {
            if (animationStartTime === null) {
                animationStartTime = now;
            }

            const elapsed = now - animationStartTime;
            const progress = Math.min(elapsed / currentDuration, 1);
            const easedProgress = easeOutCubic(progress);

            if (animationPhase === 'grow') {
                const scale = 0.001 + easedProgress * (targetScale - 0.001);
                sphereGroup.scale.set(scale, scale, scale);

                // Rotate with progressive slowdown in last 20%
                let rotationSpeed = 0.05;
                if (progress > 0.8) {
                    const slowdownProgress = (progress - 0.8) / 0.2;
                    rotationSpeed *= (1 - easeOutCubic(slowdownProgress));
                }

                if (currentAxis === 'x') {
                    sphereGroup.rotation.x += rotationSpeed;
                } else if (currentAxis === 'z') {
                    sphereGroup.rotation.z += rotationSpeed;
                } else {
                    sphereGroup.rotation.y += rotationSpeed;
                }

                if (progress >= 1) {
                    sphereGroup.scale.set(1, 1, 1);

                    if (currentMode === 'stars') {
                        animationPhase = 'fadeIn';
                        animationStartTime = now;
                    } else {
                        isAnimating = false;
                    }
                }
            } else if (animationPhase === 'fadeIn') {
                const fadeProgress = Math.min(elapsed / LABEL_FADE_DURATION, 1);

                textSprites.forEach(mesh => {
                    mesh.material.opacity = fadeProgress;
                });

                starPoints.forEach(point => {
                    point.material.opacity = 1 - fadeProgress * 0.7;
                });

                // Fade out connection lines
                connectionLines.forEach(line => {
                    line.material.opacity = 0.4 * (1 - fadeProgress * 0.8);
                });

                if (fadeProgress >= 1) {
                    isAnimating = false;
                }
            }
        }

        if (!isDragging && !isAnimating) {
            if (userIsInteracting) {
                // User is interacting: apply momentum with friction
                sphereGroup.rotation.x += rotationVelocity.x;
                sphereGroup.rotation.y += rotationVelocity.y;
                rotationVelocity.x *= 0.96;
                rotationVelocity.y *= 0.96;
            } else {
                // User not interacting: apply auto-rotation (default behavior)
                sphereGroup.rotation.y += AUTO_ROTATION_SPEED;
            }
        }

        // Animate background stars (brightness cycle)
        backgroundStars.forEach(star => {
            // Use cycleOffset to ensure each star has unique phase
            const cycleTime = (now + star.cycleOffset) % STAR_BRIGHTNESS_CYCLE;
            const progress = cycleTime / STAR_BRIGHTNESS_CYCLE; // 0 to 1

            // Calculate brightness: 0 → 1 → 0 (sine wave)
            const brightness = Math.sin(progress * Math.PI);
            star.sprite.material.opacity = brightness;
        });

        // Update shooting stars
        updateShootingStars(now);

        // Sphere orbital movement (pause when user interacts, same rules as rotation)
        if (SPHERE_ORBIT_ENABLED && !isDragging && !userIsInteracting) {
            if (orbitLastActiveTime === null) {
                orbitLastActiveTime = now;
            }
            const deltaTime = now - orbitLastActiveTime;
            orbitAccumulatedTime += deltaTime;
            orbitLastActiveTime = now;

            const angle = (orbitAccumulatedTime / SPHERE_ORBIT_PERIOD) * Math.PI * 2;
            sphereGroup.position.x = SPHERE_ORBIT_RADIUS_X * Math.cos(angle);
            sphereGroup.position.y = SPHERE_ORBIT_Y_OFFSET;
            // Move in depth while moving horizontally so sphere appears to grow/shrink.
            sphereGroup.position.z = SPHERE_ORBIT_Z_OFFSET + SPHERE_ORBIT_Z_AMPLITUDE * Math.cos(angle);
        } else {
            orbitLastActiveTime = null;
        }

        // Apply zoom distance updated by wheel before rendering.
        camera.position.z = cameraZoomDistance;
        renderer.render(scene, camera);
    }

    // Setup test panel event listeners
    const testPanel = document.getElementById('test-panel');
    if (testPanel) {
        // Toggle panel
        document.getElementById('toggle-panel').addEventListener('click', function() {
            const body = document.getElementById('test-panel-body');
            body.classList.toggle('collapsed');
            this.textContent = body.classList.contains('collapsed') ? '+' : '−';
        });

        // Mode buttons - click triggers animation
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                resetAndPlayAnimation(this.dataset.mode, currentAxis);
            });
        });

        // Axis buttons
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentAxis = this.dataset.axis;
                document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('current-axis').textContent = currentAxis.toUpperCase();
            });
        });

        // Duration slider
        const durationSlider = document.getElementById('duration-slider');
        const durationValue = document.getElementById('duration-value');
        const currentDurationDisplay = document.getElementById('current-duration');
        durationSlider.addEventListener('input', function() {
            currentDuration = parseInt(this.value);
            const seconds = (currentDuration / 1000).toFixed(1);
            durationValue.textContent = seconds;
            currentDurationDisplay.textContent = seconds;
        });

        // Replay button
        document.getElementById('replay-btn').addEventListener('click', function() {
            resetAndPlayAnimation(currentMode, currentAxis);
        });

        // Initialize button states
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === currentMode);
        });
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.axis === currentAxis);
        });

        // Use the dynamic animate function instead
        // Stop original loop and start new one
        animateWithDynamicAxis();
    } else {
        // No test panel, use original animate
        animate();
    }
    } // end initSphere
})();

    </script>

    <script>
// Ambient audio player with 2-second fade-in and toggle control
class AmbientAudioPlayer {
    constructor(audioSrc) {
        this.audio = new Audio(audioSrc);
        this.audio.loop = true;
        this.audio.volume = 0;
        this.fadeDuration = 2000; // 2 seconds fade-in
        this.targetVolume = 0.5; // Target volume (50%)
        this.isPlaying = false;
        this.isEnabled = false; // Start disabled
        this.fadeInStartTime = null;
    }

    play() {
        if (this.isPlaying || !this.isEnabled) return;
        this.isPlaying = true;
        this.fadeInStartTime = Date.now();

        this.audio.play().catch(e => {
            console.log('Audio play failed:', e);
            this.isPlaying = false;
        });

        this.animateFadeIn();
    }

    animateFadeIn() {
        if (!this.isPlaying || !this.isEnabled) return;

        const elapsed = Date.now() - this.fadeInStartTime;
        const progress = Math.min(elapsed / this.fadeDuration, 1);
        this.audio.volume = progress * this.targetVolume;

        if (progress < 1) {
            requestAnimationFrame(() => this.animateFadeIn());
        }
    }

    stop() {
        this.isPlaying = false;
        this.audio.pause();
        this.audio.currentTime = 0;
        this.audio.volume = 0;
    }

    toggle() {
        this.isEnabled = !this.isEnabled;
        if (this.isEnabled) {
            this.play();
        } else {
            this.stop();
        }
        return this.isEnabled;
    }
}

// Initialize audio with the ambient sound file
const ambientAudio = new AmbientAudioPlayer('ambient.mp3');

// Audio toggle button
const audioToggle = document.getElementById('audio-toggle');
if (audioToggle) {
    audioToggle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation(); // Prevent navigation
        const enabled = ambientAudio.toggle();
        const icon = this.querySelector('.audio-icon');
        if (icon) {
            icon.textContent = enabled ? '🔊' : '🔇';
        }
        this.classList.toggle('audio-off', !enabled);
    });
}

// Audio popup handlers
const audioPopup = document.getElementById('audio-popup');
const audioAcceptBtn = document.getElementById('audio-accept');
const audioDeclineBtn = document.getElementById('audio-decline');

function hidePopup() {
    if (audioPopup) {
        audioPopup.classList.add('hidden');
        setTimeout(() => {
            audioPopup.style.display = 'none';
        }, 300);
    }
}

function enableAudio() {
    ambientAudio.isEnabled = true;
    ambientAudio.play();
    if (audioToggle) {
        const icon = audioToggle.querySelector('.audio-icon');
        if (icon) {
            icon.textContent = '🔊';
        }
        audioToggle.classList.remove('audio-off');
    }
}

if (audioAcceptBtn) {
    audioAcceptBtn.addEventListener('click', function() {
        enableAudio();
        hidePopup();
    });
}

if (audioDeclineBtn) {
    audioDeclineBtn.addEventListener('click', function() {
        hidePopup();
    });
}
    </script>
