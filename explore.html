            const lineColor = typeColors[conn.type] || '#ffffff';
            const lineMaterial = new THREE.LineBasicMaterial({
                color: lineColor,
                transparent: true,
                opacity: 0.6,
                linewidth: 2,
                blending: THREE.AdditiveBlending
            });

            const line = new THREE.Line(lineGeometry, lineMaterial);
            line.userData = { fromIdx: idx, toIdx: conn.targetIdx, type: conn.type };
            connectionLines.push(line);
            sphereGroup.add(line);
            totalConnections++;

            // Initially hide lines unless in stars mode
            if (ANIMATION_MODE !== 'stars') {
                line.visible = false;
            }
        });
    });

    console.log('Total connection lines created:', totalConnections);

    // Drag controls
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };

    // Zoom with mouse wheel
    renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        camera.position.z += e.deltaY * 0.05;
        // Clamp zoom range
        camera.position.z = Math.max(20, Math.min(80, camera.position.z));
    }, { passive: false });

    renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            // Rotate around Y axis (yaw) and X axis (pitch)
            sphereGroup.rotation.y += deltaX * 0.005;
            sphereGroup.rotation.x += deltaY * 0.005;

            // Store velocity for momentum
            rotationVelocity = { x: deltaY * 0.0005, y: deltaX * 0.0005 };

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }
    });

    renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false;
    });

    renderer.domElement.addEventListener('mouseleave', () => {
        isDragging = false;
    });

    // Touch support
    renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    });

    renderer.domElement.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            // Rotate around Y axis (yaw) and X axis (pitch)
            sphereGroup.rotation.y += deltaX * 0.005;
            sphereGroup.rotation.x += deltaY * 0.005;

            rotationVelocity = { x: deltaY * 0.0005, y: deltaX * 0.0005 };

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    });

    renderer.domElement.addEventListener('touchend', () => {
        isDragging = false;
    });

    // Raycaster for click detection
    const raycaster = new THREE.Raycaster();
    raycaster.params.Sprite.threshold = 0.5;

    function onPointerClick(event) {
        // Ignore if we were dragging
        if (Math.abs(rotationVelocity.x) > 0.001 || Math.abs(rotationVelocity.y) > 0.001) return;

        const clientX = event.clientX || (event.changedTouches && event.changedTouches[0].clientX);
        const clientY = event.clientY || (event.changedTouches && event.changedTouches[0].clientY);

        const mouse = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
        );

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(textSprites);

        if (intersects.length > 0) {
            const clicked = intersects[0].object;
            window.location.href = clicked.userData.link;
        }
    }

    // Double-click to navigate
    renderer.domElement.addEventListener('dblclick', onPointerClick);

    // Double-tap for touch devices
    let lastTap = 0;
    renderer.domElement.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
            onPointerClick(e);
        }
        lastTap = now;
    });

    // Hover effect
    let hoveredSprite = null;
    const infoPanel = document.getElementById('info-panel');

    function onPointerMove(event) {
        const clientX = event.clientX || (event.touches && event.touches[0].clientX);
        const clientY = event.clientY || (event.touches && event.touches[0].clientY);

        const mouse = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
        );

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(textSprites);

        if (intersects.length > 0) {
            const sprite = intersects[0].object;
            if (hoveredSprite !== sprite) {
                hoveredSprite = sprite;
                renderer.domElement.style.cursor = 'pointer';
                infoPanel.textContent = sprite.userData.text;
            }
        } else {
            if (hoveredSprite) {
                hoveredSprite = null;
                renderer.domElement.style.cursor = 'grab';
                infoPanel.textContent = 'Glissez pour tourner • Molette pour zoomer • Double-clic pour ouvrir';
            }
        }
    }

    renderer.domElement.addEventListener('mousemove', onPointerMove);
    renderer.domElement.style.cursor = 'grab';

    // Easing function for smooth animation
    function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
    }

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();

        // Handle animation phases
        if (isAnimating) {
            if (animationStartTime === null) {
                animationStartTime = now;
            }

            const elapsed = now - animationStartTime;
            const progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            const easedProgress = easeOutCubic(progress);

            if (animationPhase === 'grow') {
                // Scale animation (both Growth and Stars modes)
                const scale = 0.001 + easedProgress * (targetScale - 0.001);
                sphereGroup.scale.set(scale, scale, scale);

                // Rotate during growth animation with progressive slowdown
                // Full speed until 80%, then decelerate smoothly to stop
                let rotationSpeed = 0.05;
                if (progress > 0.8) {
                    // Ease out the last 20%: map 0.8-1.0 to 1.0-0.0
                    const slowdownProgress = (progress - 0.8) / 0.2;
                    rotationSpeed *= (1 - easeOutCubic(slowdownProgress));
                }

                if (ROTATION_AXIS === 'x') {
                    sphereGroup.rotation.x += rotationSpeed;
                } else if (ROTATION_AXIS === 'z') {
                    sphereGroup.rotation.z += rotationSpeed;
                } else {
                    sphereGroup.rotation.y += rotationSpeed;  // Default Y
                }

                // Check if grow phase is complete
                if (progress >= 1) {
                    sphereGroup.scale.set(1, 1, 1);

                    if (ANIMATION_MODE === 'stars') {
                        // Move to fade-in phase for labels
                        animationPhase = 'fadeIn';
                        animationStartTime = now;
                    } else {
                        // Growth mode complete
                        isAnimating = false;
                    }
                }
            } else if (animationPhase === 'fadeIn') {
                // Fade in labels (Stars mode only)
                const fadeProgress = Math.min(elapsed / LABEL_FADE_DURATION, 1);

                textSprites.forEach(mesh => {
                    mesh.material.opacity = fadeProgress;
                });

                // Fade out star points and connection lines
                starPoints.forEach(point => {
                    point.material.opacity = 1 - fadeProgress * 0.7;  // Keep some visibility
                });

                // Fade out connection lines
                connectionLines.forEach(line => {
                    line.material.opacity = 0.4 * (1 - fadeProgress * 0.8);
                });

                if (fadeProgress >= 1) {
                    isAnimating = false;
                }
            }
        }

        // Apply momentum with friction when not dragging (and not animating)
        if (!isDragging && !isAnimating) {
            sphereGroup.rotation.x += rotationVelocity.x;
            sphereGroup.rotation.y += rotationVelocity.y;
            rotationVelocity.x *= 0.96;
            rotationVelocity.y *= 0.96;
        }

        renderer.render(scene, camera);
    }
    // animate() is now called conditionally at the end

    // Responsive
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== TEST PANEL CONTROLS ==========
    let currentMode = ANIMATION_MODE;
    let currentAxis = ROTATION_AXIS;
    let currentDuration = ANIMATION_DURATION;

    function resetAndPlayAnimation(mode, axis) {
        currentMode = mode;
        currentAxis = axis || currentAxis;

        // Update UI
        document.getElementById('current-mode').textContent = mode;
        document.getElementById('current-axis').textContent = currentAxis.toUpperCase();

        // Update button states
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.axis === currentAxis);
        });

        // Reset sphere state
        sphereGroup.scale.set(0.001, 0.001, 0.001);
        sphereGroup.rotation.set(0, 0, 0);
        rotationVelocity = { x: 0, y: 0 };

        // Reset labels, star points, and connection lines based on mode
        if (mode === 'stars') {
            // Hide labels, show stars and lines
            textSprites.forEach(mesh => {
                mesh.material.opacity = 0;
            });
            starPoints.forEach(point => {
                point.material.opacity = 1;
                point.visible = true;
            });
            connectionLines.forEach(line => {
                line.material.opacity = 0.4;
                line.visible = true;
            });
        } else {
            // Show labels, hide stars and lines
            textSprites.forEach(mesh => {
                mesh.material.opacity = 1;
            });
            starPoints.forEach(point => {
                point.visible = false;
            });
            connectionLines.forEach(line => {
                line.visible = false;
            });
        }

        // Start animation
        if (mode !== 'none') {
            animationStartTime = null;
            animationPhase = 'grow';
            isAnimating = true;
        } else {
            // No animation - just show at full scale
            sphereGroup.scale.set(1, 1, 1);
            isAnimating = false;
        }
    }

    // Override animation axis in the loop
    const originalAnimate = animate;
    function animateWithDynamicAxis() {
        requestAnimationFrame(animateWithDynamicAxis);
        const now = performance.now();

        if (isAnimating) {
            if (animationStartTime === null) {
                animationStartTime = now;
            }

            const elapsed = now - animationStartTime;
            const progress = Math.min(elapsed / currentDuration, 1);
            const easedProgress = easeOutCubic(progress);

            if (animationPhase === 'grow') {
                const scale = 0.001 + easedProgress * (targetScale - 0.001);
                sphereGroup.scale.set(scale, scale, scale);

                // Rotate with progressive slowdown in last 20%
                let rotationSpeed = 0.05;
                if (progress > 0.8) {
                    const slowdownProgress = (progress - 0.8) / 0.2;
                    rotationSpeed *= (1 - easeOutCubic(slowdownProgress));
                }

                if (currentAxis === 'x') {
                    sphereGroup.rotation.x += rotationSpeed;
                } else if (currentAxis === 'z') {
                    sphereGroup.rotation.z += rotationSpeed;
                } else {
                    sphereGroup.rotation.y += rotationSpeed;
                }

                if (progress >= 1) {
                    sphereGroup.scale.set(1, 1, 1);

                    if (currentMode === 'stars') {
                        animationPhase = 'fadeIn';
                        animationStartTime = now;
                    } else {
                        isAnimating = false;
                    }
                }
            } else if (animationPhase === 'fadeIn') {
                const fadeProgress = Math.min(elapsed / LABEL_FADE_DURATION, 1);

                textSprites.forEach(mesh => {
                    mesh.material.opacity = fadeProgress;
                });

                starPoints.forEach(point => {
                    point.material.opacity = 1 - fadeProgress * 0.7;
                });

                // Fade out connection lines
                connectionLines.forEach(line => {
                    line.material.opacity = 0.4 * (1 - fadeProgress * 0.8);
                });

                if (fadeProgress >= 1) {
                    isAnimating = false;
                }
            }
        }

        if (!isDragging && !isAnimating) {
            sphereGroup.rotation.x += rotationVelocity.x;
            sphereGroup.rotation.y += rotationVelocity.y;
            rotationVelocity.x *= 0.96;
            rotationVelocity.y *= 0.96;
        }

        renderer.render(scene, camera);
    }

    // Setup test panel event listeners
    const testPanel = document.getElementById('test-panel');
    if (testPanel) {
        // Toggle panel
        document.getElementById('toggle-panel').addEventListener('click', function() {
            const body = document.getElementById('test-panel-body');
            body.classList.toggle('collapsed');
            this.textContent = body.classList.contains('collapsed') ? '+' : '−';
        });

        // Mode buttons - click triggers animation
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                resetAndPlayAnimation(this.dataset.mode, currentAxis);
            });
        });

        // Axis buttons
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentAxis = this.dataset.axis;
                document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('current-axis').textContent = currentAxis.toUpperCase();
            });
        });

        // Duration slider
        const durationSlider = document.getElementById('duration-slider');
        const durationValue = document.getElementById('duration-value');
        const currentDurationDisplay = document.getElementById('current-duration');
        durationSlider.addEventListener('input', function() {
            currentDuration = parseInt(this.value);
            const seconds = (currentDuration / 1000).toFixed(1);
            durationValue.textContent = seconds;
            currentDurationDisplay.textContent = seconds;
        });

        // Replay button
        document.getElementById('replay-btn').addEventListener('click', function() {
            resetAndPlayAnimation(currentMode, currentAxis);
        });

        // Initialize button states
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === currentMode);
        });
        document.querySelectorAll('.axis-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.axis === currentAxis);
        });

        // Use the dynamic animate function instead
        // Stop original loop and start new one
        animateWithDynamicAxis();
    } else {
        // No test panel, use original animate
        animate();
    }
    } // end initSphere
})();

    </script>

</body>
</html>
